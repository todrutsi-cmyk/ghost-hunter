<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>신비아파트: 고스트 헌터</title>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Black+Han+Sans&display=swap" rel="stylesheet">
    <style>
        :root {
            --red: #ff1a1a;
            --red-glow: rgba(255,26,26,0.7);
            --gold: #ffd700;
            --dark: #0a0008;
            --purple: #3d0066;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body, html {
            width: 100%; height: 100%; overflow: hidden;
            background: #000;
            font-family: 'Nanum Myeongjo', serif;
        }

        /* ── 카메라 뷰 ── */
        #cam-view {
            position: absolute; inset: 0;
        }
        video {
            width: 100%; height: 100%;
            object-fit: cover;
            display: block;
        }

        /* 카메라 뷰파인더 오버레이 */
        #cam-overlay {
            position: absolute; inset: 0;
            pointer-events: none;
            background:
                linear-gradient(to bottom, rgba(0,0,0,0.5) 0%, transparent 20%, transparent 80%, rgba(0,0,0,0.5) 100%);
        }

        /* 코너 브라켓 */
        .bracket { position: absolute; width: 50px; height: 50px; opacity: 0.7; }
        .bracket.tl { top: 60px; left: 15px; border-top: 2px solid #0f0; border-left: 2px solid #0f0; }
        .bracket.tr { top: 60px; right: 15px; border-top: 2px solid #0f0; border-right: 2px solid #0f0; }
        .bracket.bl { bottom: 100px; left: 15px; border-bottom: 2px solid #0f0; border-left: 2px solid #0f0; }
        .bracket.br { bottom: 100px; right: 15px; border-bottom: 2px solid #0f0; border-right: 2px solid #0f0; }

        /* 스캔라인 */
        #scanline {
            position: absolute; inset: 0;
            background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,255,0,0.02) 3px, rgba(0,255,0,0.02) 4px);
            pointer-events: none;
            z-index: 5;
        }

        /* 귀신 레이더 */
        #radar-bar {
            position: absolute; top: 0; left: 0; right: 0; height: 4px;
            background: rgba(0,255,0,0.2);
            z-index: 20;
        }
        #radar-fill {
            height: 100%; background: #0f0;
            width: 0%; transition: width 0.3s;
            box-shadow: 0 0 8px #0f0;
        }

        /* 상단 HUD */
        #hud-top {
            position: absolute; top: 14px; left: 0; right: 0;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 15px;
            z-index: 30;
        }
        #ghost-detector {
            background: rgba(0,0,0,0.7);
            border: 1px solid #0f0;
            border-radius: 6px;
            padding: 4px 10px;
            color: #0f0;
            font-size: 11px;
            font-family: monospace;
            letter-spacing: 1px;
        }
        #collection-count {
            background: rgba(0,0,0,0.7);
            border: 1px solid var(--gold);
            border-radius: 6px;
            padding: 4px 10px;
            color: var(--gold);
            font-size: 11px;
            font-family: monospace;
        }

        /* 메시지 */
        #msg {
            position: absolute; top: 50px; left: 0; right: 0;
            text-align: center;
            z-index: 30;
            padding: 0 20px;
        }
        #msg-inner {
            display: inline-block;
            background: rgba(0,0,0,0.75);
            color: #fff;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 15px;
            font-weight: 700;
            border: 1px solid rgba(255,255,255,0.2);
            text-shadow: 0 0 10px rgba(255,0,0,0.5);
            font-family: 'Black Han Sans', sans-serif;
        }

        /* 귀신 등장 컨테이너 */
        #target-wrap {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -55%);
            display: none;
            z-index: 100;
            cursor: pointer;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        /* 귀신 이미지 */
        #ghost-img {
            width: 180px;
            height: 180px;
            object-fit: contain;
            filter: drop-shadow(0 0 20px var(--red)) drop-shadow(0 0 40px var(--red-glow));
            animation: ghost-float 2.5s ease-in-out infinite;
        }

        @keyframes ghost-float {
            0%, 100% { transform: translateY(0) rotate(-2deg) scale(1); }
            50% { transform: translateY(-18px) rotate(2deg) scale(1.05); }
        }

        /* 귀신 이름 태그 */
        #ghost-name-tag {
            margin-top: 10px;
            background: rgba(0,0,0,0.85);
            border: 1px solid var(--red);
            padding: 5px 18px;
            border-radius: 20px;
            color: #fff;
            font-family: 'Black Han Sans', sans-serif;
            font-size: 16px;
            text-shadow: 0 0 8px var(--red);
            letter-spacing: 2px;
        }

        /* 잡기 버튼 */
        #catch-btn {
            margin-top: 14px;
            background: linear-gradient(135deg, #ff1a1a, #990000);
            border: 2px solid #ff6666;
            color: #fff;
            padding: 12px 32px;
            border-radius: 30px;
            font-size: 18px;
            font-family: 'Black Han Sans', sans-serif;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255,0,0,0.5);
            animation: btn-pulse 1.5s ease-in-out infinite;
        }
        @keyframes btn-pulse {
            0%, 100% { box-shadow: 0 0 20px rgba(255,0,0,0.5); }
            50% { box-shadow: 0 0 35px rgba(255,0,0,0.9), 0 0 60px rgba(255,0,0,0.3); }
        }

        /* 카메라 셔터 효과 */
        #shutter {
            position: absolute; inset: 0;
            background: #fff;
            z-index: 500;
            opacity: 0;
            pointer-events: none;
            transition: none;
        }
        #shutter.flash {
            animation: shutter-anim 0.6s ease-out forwards;
        }
        @keyframes shutter-anim {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* 포획 성공 캔버스 */
        #capture-screen {
            position: absolute; inset: 0;
            z-index: 400;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.85);
        }
        .polaroid {
            background: #fff;
            padding: 12px 12px 50px 12px;
            border-radius: 3px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.1);
            transform: rotate(-3deg);
            animation: polaroid-in 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes polaroid-in {
            from { transform: rotate(-3deg) scale(0.3) translateY(100px); opacity: 0; }
            to { transform: rotate(-3deg) scale(1) translateY(0); opacity: 1; }
        }
        #polaroid-canvas {
            display: block;
            width: 240px;
            height: 240px;
            background: #ccc;
        }
        .polaroid-label {
            text-align: center;
            margin-top: 12px;
            font-family: 'Black Han Sans', sans-serif;
            font-size: 18px;
            color: #222;
            letter-spacing: 2px;
        }
        .polaroid-sub {
            text-align: center;
            font-size: 10px;
            color: #888;
            margin-top: 4px;
            font-family: monospace;
        }
        #capture-close-btn {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,255,255,0.15);
            border: 2px solid rgba(255,255,255,0.5);
            color: #fff;
            padding: 12px 40px;
            border-radius: 30px;
            font-size: 16px;
            font-family: 'Black Han Sans', sans-serif;
            cursor: pointer;
        }

        /* ── 도감 ── */
        #book-screen {
            position: absolute; inset: 0;
            background: linear-gradient(160deg, #0a0008 0%, #1a0030 100%);
            z-index: 300; display: none;
            overflow-y: auto;
            padding: 20px;
        }
        #book-screen h1 {
            font-family: 'Black Han Sans', sans-serif;
            color: var(--gold);
            font-size: 22px;
            text-align: center;
            margin-bottom: 5px;
            text-shadow: 0 0 15px var(--gold);
            letter-spacing: 3px;
        }
        #book-screen .subtitle {
            text-align: center;
            color: rgba(255,255,255,0.4);
            font-size: 11px;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .tab-menu {
            display: flex; gap: 8px;
            margin-bottom: 16px;
        }
        .tab {
            flex: 1; padding: 10px;
            text-align: center;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            color: rgba(255,255,255,0.5);
            font-family: 'Black Han Sans', sans-serif;
            font-size: 14px;
            cursor: pointer;
        }
        .tab.active {
            background: linear-gradient(135deg, #ff1a1a, #990000);
            border-color: #ff4444;
            color: #fff;
            box-shadow: 0 0 15px rgba(255,0,0,0.4);
        }

        .progress-bar {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            height: 8px;
            margin-bottom: 16px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff1a1a, #ff6600);
            border-radius: 10px;
            transition: width 0.5s;
            box-shadow: 0 0 10px rgba(255,100,0,0.6);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .item-slot {
            aspect-ratio: 0.85;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px 4px;
            position: relative;
            overflow: hidden;
            transition: transform 0.2s;
        }

        .item-slot.collected {
            border-color: rgba(255,100,0,0.5);
            background: rgba(255,50,0,0.08);
        }

        .item-slot.collected:active { transform: scale(0.95); }

        .item-slot .slot-img {
            width: 55px; height: 55px;
            object-fit: contain;
            margin-bottom: 6px;
            filter: drop-shadow(0 0 8px rgba(255,50,0,0.6));
        }

        .item-slot.locked .slot-img {
            filter: brightness(0) invert(0.1);
        }

        .item-slot .slot-name {
            font-size: 9px;
            color: #fff;
            text-align: center;
            line-height: 1.3;
            font-family: 'Black Han Sans', sans-serif;
        }

        .item-slot.locked .slot-name { color: rgba(255,255,255,0.2); }

        .item-slot .locked-icon {
            font-size: 20px;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.4;
        }

        /* 폴라로이드 미니 (도감 내) */
        .item-slot .polaroid-frame {
            width: 55px; height: 60px;
            background: #fff;
            padding: 3px 3px 12px 3px;
            transform: rotate(-2deg);
            margin-bottom: 4px;
        }
        .item-slot .polaroid-frame img {
            width: 100%; height: 100%;
            object-fit: contain;
        }

        #book-close {
            display: block;
            margin: 20px auto 10px;
            padding: 14px 50px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            border-radius: 30px;
            font-size: 16px;
            font-family: 'Black Han Sans', sans-serif;
            cursor: pointer;
        }

        /* ── 하단 UI ── */
        .bottom-ui {
            position: absolute; bottom: 20px; left: 0; right: 0;
            display: flex; justify-content: center; gap: 15px;
            z-index: 30;
        }
        .ui-btn {
            background: rgba(0,0,0,0.75);
            border: 1px solid rgba(255,255,255,0.3);
            color: #fff;
            padding: 12px 20px;
            border-radius: 25px;
            font-size: 13px;
            font-family: 'Black Han Sans', sans-serif;
            cursor: pointer;
            letter-spacing: 1px;
            backdrop-filter: blur(5px);
            display: flex; align-items: center; gap: 6px;
        }
        .ui-btn .icon { font-size: 16px; }

        /* ── 귀신 출현 경고 ── */
        #danger-flash {
            position: absolute; inset: 0;
            z-index: 50;
            pointer-events: none;
            opacity: 0;
            border: 4px solid red;
            box-shadow: inset 0 0 60px rgba(255,0,0,0.5);
        }
        #danger-flash.active {
            animation: danger-pulse 0.5s ease-in-out 3;
        }
        @keyframes danger-pulse {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }

        /* ── 출현 연출 ── */
        @keyframes appear-zap {
            0% { opacity: 0; transform: translate(-50%, -55%) scale(0.2) rotate(-15deg); filter: brightness(5) drop-shadow(0 0 40px red); }
            60% { opacity: 1; transform: translate(-50%, -55%) scale(1.1) rotate(3deg); }
            100% { opacity: 1; transform: translate(-50%, -55%) scale(1) rotate(0deg); }
        }

        #target-wrap.show {
            animation: appear-zap 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
    </style>
</head>

<!-- 카메라 -->
<div id="cam-view">
    <video id="v" autoplay playsinline muted></video>
    <div id="cam-overlay">
        <div class="bracket tl"></div>
        <div class="bracket tr"></div>
        <div class="bracket bl"></div>
        <div class="bracket br"></div>
    </div>
    <div id="scanline"></div>
</div>

<!-- 레이더 -->

<!-- HUD 상단 -->
<div id="hud-top">

    <div id="collection-count">📖 0 / 25</div>
</div>

<!-- 위험 플래시 -->
<div id="danger-flash"></div>

<!-- 메시지 -->
<div id="msg"><div id="msg-inner">📡 주변을 탐색하세요!</div></div>

<!-- 귀신 등장 -->
<div id="target-wrap">

</div>

<!-- 셔터 효과 -->
<div id="shutter"></div>

<!-- 포획 성공 화면 -->
<div id="capture-screen" style="display:none; position:absolute; inset:0; z-index:400; align-items:center; justify-content:center; background:rgba(0,0,0,0.85);">

    <button id="capture-close-btn" onclick="closeCaptureScreen()">도감에 저장 ✓</button>
</div>

<!-- 도감 화면 -->
<div id="book-screen">

    <div class="tab-menu">
        <div id="tab-g" class="tab active" onclick="switchTab('g')">귀신 (15)</div>
        <div id="tab-i" class="tab" onclick="switchTab('i')">아이템 (10)</div>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="prog-fill" style="width:0%"></div></div>
    <div id="grid-content" class="grid"></div>
    <button id="book-close" onclick="closeBook()">닫기</button>
</div>

<!-- 하단 버튼 -->
<div class="bottom-ui">
    <button class="ui-btn" onclick="showBook()">
        <span class="icon">📖</span> 도감
    </button>
    <button class="ui-btn" onclick="manualTrigger()">
        <span class="icon">🔦</span> 탐색
    </button>
</div>

    { id:'i8', name:'영혼 카메라', type:'item', img:'https://www.svgrepo.com/show/523190/camera.svg', desc:'귀신을 찍는 특수 카메라' },
    { id:'i9', name:'신비 랜턴', type:'item', img:'https://www.svgrepo.com/show/523191/lantern.svg', desc:'어둠을 밝히는 신비한 빛' },
    { id:'i10', name:'고스트 지도', type:'item', img:'https://www.svgrepo.com/show/523192/map.svg', desc:'귀신 출몰 지도' }
];

// 이모지 기반 고품질 귀신 SVG 생성 (실제 이미지 대신)
const ghostEmojis = ['👻','💀','🕷','🦇','🎃','👾','😱','🌑','🔮','💜','🌙','⚰️','🩸','🕯','👁'];
const itemEmojis  = ['🪆','🍫','🔮','📜','🍬','🧂','🫘','📷','🏮','🗺'];

const rarityColors = {
    common: '#aaa',
    rare: '#4488ff',
    epic: '#cc44ff',
    legendary: '#ffaa00'
};
const rarityLabel = {
    common:'일반', rare:'레어', epic:'에픽', legendary:'전설'
};

// ──────────────────────────────────────────────
//  상태
// ──────────────────────────────────────────────
let collected = JSON.parse(localStorage.getItem('shinbi_v5') || '[]');
let isAppeared = false;
let lastAlpha = 0;
let currentTarget = null;
let currentTab = 'g';
let videoStream = null;

// ──────────────────────────────────────────────
//  시작
// ──────────────────────────────────────────────
async function start() {
    try {
        const s = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
        });
        document.getElementById('v').srcObject = s;
        videoStream = s;
        document.getElementById('ghost-detector').textContent = '👁 탐지중...';
    } catch(e) {
        document.getElementById('ghost-detector').textContent = '⚠ 카메라 없음';
        // 카메라 없어도 게임 가능
    }

    updateCollectionCount();

    // 위치 감지
    if ('geolocation' in navigator) {
        navigator.geolocation.watchPosition(() => {
            if (!isAppeared && Math.random() > 0.65) triggerAppearance();
        }, null, { enableHighAccuracy: true });
    }

    // 방향 감지
    if (window.DeviceOrientationEvent) {
        window.addEventListener('deviceorientation', e => {
            if (!e.alpha) return;
            let diff = Math.abs(e.alpha - lastAlpha);
            if (diff > 30 && !isAppeared) {
                if (Math.random() > 0.92) triggerAppearance();
                lastAlpha = e.alpha;
            }
        });
    }

    // 자동 레이더 올라가는 효과
    radarLoop();
}

let radarValue = 0;
let radarDir = 1;
function radarLoop() {
    radarValue += radarDir * (Math.random() * 2);
    if (radarValue >= 100) { radarValue = 100; radarDir = -1; }
    if (radarValue <= 0) { radarValue = 0; radarDir = 1; }
    document.getElementById('radar-fill').style.width = radarValue + '%';
    
    // 레이더 가득 차면 귀신 등장
    if (radarValue >= 98 && !isAppeared) {
        triggerAppearance();
    }
    
    // 탐지 텍스트 업데이트
    if (radarValue < 30) document.getElementById('ghost-detector').textContent = '👁 탐지중...';
    else if (radarValue < 60) document.getElementById('ghost-detector').textContent = '⚡ 반응 감지!';
    else if (radarValue < 85) document.getElementById('ghost-detector').textContent = '⚠️ 접근 중!';
    else document.getElementById('ghost-detector').textContent = '🚨 출현 임박!';

    setTimeout(radarLoop, 80);
}

// ──────────────────────────────────────────────
//  귀신 등장
// ──────────────────────────────────────────────
function triggerAppearance() {
    isAppeared = true;
    radarValue = 0;

    const isGhost = Math.random() > 0.4;
    const pool = isGhost ? ghosts : items;
    const res = pool[Math.floor(Math.random() * pool.length)];
    currentTarget = res;

    // 위험 플래시
    const df = document.getElementById('danger-flash');
    df.classList.add('active');
    setTimeout(() => df.classList.remove('active'), 1600);

    // 귀신 이미지 (이모지 캔버스로 그리기)
    const idx = (isGhost ? ghosts : items).indexOf(res);
    const emoji = isGhost ? ghostEmojis[idx % ghostEmojis.length] : itemEmojis[idx % itemEmojis.length];
    
    const wrap = document.getElementById('target-wrap');
    const ghostImg = document.getElementById('ghost-img');
    
    // 이모지를 캔버스로 렌더
    ghostImg.src = emojiToDataURL(emoji, isGhost ? '#ff1a1a' : '#ffd700', 180);
    document.getElementById('ghost-name-tag').textContent = res.name;
    
    if (isGhost) {
        ghostImg.style.filter = 'drop-shadow(0 0 20px #ff1a1a) drop-shadow(0 0 40px rgba(255,0,0,0.5))';
    } else {
        ghostImg.style.filter = 'drop-shadow(0 0 20px #ffd700) drop-shadow(0 0 40px rgba(255,215,0,0.5))';
    }

    wrap.style.display = 'flex';
    wrap.classList.remove('show');
    void wrap.offsetWidth; // reflow
    wrap.classList.add('show');

    setMsg(`⚠️ [${res.name}] 출현!`, '#ff4444');

    // 진동
    if (navigator.vibrate) navigator.vibrate([100, 50, 100, 50, 200]);
}

function emojiToDataURL(emoji, glowColor, size) {
    const canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext('2d');
    
    // 배경 원 (반투명)
    ctx.beginPath();
    ctx.arc(size/2, size/2, size/2 - 4, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fill();
    
    // 테두리
    ctx.strokeStyle = glowColor;
    ctx.lineWidth = 2;
    ctx.stroke();
    
    // 이모지
    ctx.font = `${size * 0.55}px serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(emoji, size/2, size/2);
    
    // 노이즈 그레인 효과 (무서운 느낌)
    for (let i = 0; i < 200; i++) {
        const x = Math.random() * size;
        const y = Math.random() * size;
        const a = Math.random() * 0.15;
        ctx.fillStyle = `rgba(255,0,0,${a})`;
        ctx.fillRect(x, y, 1, 1);
    }
    
    return canvas.toDataURL();
}

// ──────────────────────────────────────────────
//  귀신 잡기
// ──────────────────────────────────────────────
function catchGhost() {
    if (!currentTarget || !isAppeared) return;
    const res = currentTarget;

    // 셔터 효과
    const shutter = document.getElementById('shutter');
    shutter.classList.add('flash');
    setTimeout(() => shutter.classList.remove('flash'), 600);

    // 진동 (카메라 셔터 느낌)
    if (navigator.vibrate) navigator.vibrate([30, 10, 30]);

    // 귀신 숨기기
    document.getElementById('target-wrap').style.display = 'none';

    // 수집 처리
    if (!collected.includes(res.id)) {
        collected.push(res.id);
        localStorage.setItem('shinbi_v5', JSON.stringify(collected));
    }
    updateCollectionCount();

    // 폴라로이드 화면 생성
    setTimeout(() => showPolaroid(res), 300);
}

function showPolaroid(res) {
    const canvas = document.getElementById('polaroid-canvas');
    const ctx = canvas.getContext('2d');
    const W = 240, H = 240;

    // 카메라 실사 느낌 배경 (어두운 실내)
    const grad = ctx.createRadialGradient(W/2, H/2, 20, W/2, H/2, W/2);
    grad.addColorStop(0, '#1a1a1a');
    grad.addColorStop(1, '#050505');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // 노이즈 그레인
    for (let i = 0; i < 3000; i++) {
        const x = Math.random() * W;
        const y = Math.random() * H;
        const v = Math.random() * 60;
        ctx.fillStyle = `rgba(${v},${v},${v},0.4)`;
        ctx.fillRect(x, y, 1, 1);
    }

    // 비네팅
    const vig = ctx.createRadialGradient(W/2, H/2, W*0.25, W/2, H/2, W*0.7);
    vig.addColorStop(0, 'transparent');
    vig.addColorStop(1, 'rgba(0,0,0,0.75)');
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, W, H);

    // 귀신 이모지 크게
    const idx = ghosts.findIndex(g => g.id === res.id);
    const isGhost = res.type === 'ghost';
    const emoji = isGhost ? ghostEmojis[idx >= 0 ? idx : 0] : itemEmojis[items.findIndex(i => i.id === res.id) || 0];
    
    ctx.font = '100px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    
    // 글로우
    ctx.shadowColor = isGhost ? '#ff1a1a' : '#ffd700';
    ctx.shadowBlur = 30;
    ctx.fillText(emoji, W/2, H/2 - 10);
    ctx.shadowBlur = 0;

    // 날짜
    const now = new Date();
    const dateStr = `${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')}`;
    ctx.font = '11px monospace';
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.textAlign = 'center';
    ctx.fillText(dateStr, W/2, H - 18);

    // 좌측 하단 희귀도
    if (res.rarity) {
        ctx.font = 'bold 10px monospace';
        ctx.fillStyle = rarityColors[res.rarity] || '#fff';
        ctx.textAlign = 'left';
        ctx.fillText(`★ ${rarityLabel[res.rarity] || ''}`, 12, H - 18);
    }

    document.getElementById('polaroid-name').textContent = res.name;
    document.getElementById('polaroid-time').textContent = `${dateStr} 포획 완료`;

    const cs = document.getElementById('capture-screen');
    cs.style.display = 'flex';

    confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 }, colors: ['#ff1a1a','#ff6600','#ffd700','#fff'] });
}

function closeCaptureScreen() {
    document.getElementById('capture-screen').style.display = 'none';
    setMsg('✅ 도감에 저장됨!', '#00ff88');
    setTimeout(() => {
        isAppeared = false;
        setMsg('📡 주변을 탐색하세요!', '#fff');
    }, 2500);
}

// ──────────────────────────────────────────────
//  도감
// ──────────────────────────────────────────────
function showBook() {
    document.getElementById('book-screen').style.display = 'block';
    renderGrid();
}
function closeBook() {
    document.getElementById('book-screen').style.display = 'none';
}
function switchTab(t) {
    currentTab = t;
    document.getElementById('tab-g').className = t==='g' ? 'tab active' : 'tab';
    document.getElementById('tab-i').className = t==='i' ? 'tab active' : 'tab';
    renderGrid();
}

function renderGrid() {
    const data = currentTab === 'g' ? ghosts : items;
    const emojiList = currentTab === 'g' ? ghostEmojis : itemEmojis;
    const total = data.length;
    const got = data.filter(d => collected.includes(d.id)).length;
    
    document.getElementById('prog-fill').style.width = (got/total*100) + '%';

    const grid = document.getElementById('grid-content');
    grid.innerHTML = data.map((d, idx) => {
        const has = collected.includes(d.id);
        const emoji = emojiList[idx % emojiList.length];
        const rColor = d.rarity ? rarityColors[d.rarity] : '#666';
        
        if (has) {
            return `
            <div class="item-slot collected" style="border-color:${rColor}33; background: ${rColor}11">
                <div class="polaroid-frame" style="border: 2px solid ${rColor}; transform:rotate(${(Math.random()-0.5)*4}deg)">
                    <span style="font-size:40px; display:flex; align-items:center; justify-content:center; height:100%">${emoji}</span>
                </div>
                <div class="slot-name" style="color:${rColor}">${d.name}</div>
                ${d.rarity ? `<div style="font-size:8px;color:${rColor};margin-top:2px">★ ${rarityLabel[d.rarity]}</div>` : ''}
            </div>`;
        } else {
            return `
            <div class="item-slot locked">
                <span class="locked-icon">🔒</span>
                <div class="slot-name">???</div>
            </div>`;
        }
    }).join('');
}

function updateCollectionCount() {
    const total = ghosts.length + items.length;
    document.getElementById('collection-count').textContent = `📖 ${collected.length} / ${total}`;
}

// ──────────────────────────────────────────────
//  유틸
// ──────────────────────────────────────────────
function setMsg(text, color = '#fff') {
    const el = document.getElementById('msg-inner');
    el.textContent = text;
    el.style.color = color;
    el.style.textShadow = `0 0 10px ${color}`;
}

function manualTrigger() {
    if (isAppeared) return;
    radarValue = 95;
    setMsg('🔦 탐색 중...', '#0f0');
    if (navigator.vibrate) navigator.vibrate(50);
}

// ──────────────────────────────────────────────
//  초기화
// ──────────────────────────────────────────────
window.onload = start;
</script>
