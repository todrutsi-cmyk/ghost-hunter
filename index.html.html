<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>신비아파트: 고스트&아이템 헌터 v1.0</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
        video { width: 100%; height: 100%; object-fit: cover; position: absolute; }
        
        /* 상단 메시지 */
        #msg { position: absolute; top: 40px; width: 100%; text-align: center; color: #fff; text-shadow: 2px 2px #000; z-index: 100; font-size: 18px; font-weight: bold; }

        /* 타겟(귀신/아이템) */
        #target { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 220px; display: none; z-index: 200; cursor: pointer;
            filter: drop-shadow(0 0 15px #0f0); animation: float 2s infinite;
        }
        @keyframes float { 0%, 100% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -60%) scale(1.1); } }

        /* 하단 버튼바 */
        .bottom-ui { position: absolute; bottom: 30px; width: 100%; display: flex; justify-content: center; gap: 20px; z-index: 100; }
        .btn { background: rgba(0,255,0,0.8); border: 2px solid #fff; padding: 12px 25px; border-radius: 30px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }

        /* 도감 팝업 */
        #book-screen { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.95); z-index: 300; display: none; color: white;
            overflow-y: auto; padding: 20px; box-sizing: border-box;
        }
        .tab-menu { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab { flex: 1; padding: 10px; text-align: center; background: #333; border-radius: 5px; }
        .tab.active { background: #0f0; color: #000; }
        .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        .item-slot { aspect-ratio: 1; border: 1px solid #444; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; border-radius: 8px; text-align: center; }
    </style>
</head>
<body>

    <video id="v" autoplay playsinline></video>
    <div id="msg">화면을 돌리거나 이동하며 탐색하세요!</div>
    
    <img id="target" src="" alt="target">

    <div class="bottom-ui">
        <button class="btn" onclick="showBook()">고스트 도감 보기</button>
    </div>

    <div id="book-screen">
        <div class="tab-menu">
            <div id="tab-g" class="tab active" onclick="switchTab('g')">귀신(15)</div>
            <div id="tab-i" class="tab" onclick="switchTab('i')">아이템(10)</div>
        </div>
        <div id="grid-content" class="grid"></div>
        <button onclick="closeBook()" style="margin-top: 30px; padding: 15px; width: 100%; background: #555; color: #fff; border: none; border-radius: 10px;">닫기</button>
    </div>

    <!-- 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>

    <script>
        const v = document.getElementById('v');
        const target = document.getElementById('target');
        const msg = document.getElementById('msg');
        
        // 1. 귀신 15종 데이터 세팅
        const ghosts = [
            { id: 'g1', name: '벽수귀', type: 'ghost', img: 'https://cdn-icons-png.flaticon.com/512/1070/1070260.png' },
            { id: 'g2', name: '흑진귀', type: 'ghost', img: 'https://cdn-icons-png.flaticon.com/512/1360/1360341.png' },
            { id: 'g3', name: '팬텀토르소', type: 'ghost', img: 'https://cdn-icons-png.flaticon.com/512/606/606795.png' },
            { id: 'g4', name: '모주귀', type: 'ghost', img: 'https://cdn-icons-png.flaticon.com/512/806/806567.png' },
            { id: 'g5', name: '무면귀', type: 'ghost', img: 'https://cdn-icons-png.flaticon.com/512/3221/3221085.png' },
            { id: 'g6', name: '치돈귀', type: 'ghost', img: 'https://cdn-icons-png.flaticon.com/512/2800/2800109.png' },
            { id: 'g7', name: '환마귀', type: 'ghost', img: 'https://cdn-icons-png.flaticon.com/512/428/428172.png' },
            { id: 'g8', name: '망부화', type: 'ghost', img: 'https://cdn-icons-png.flaticon.com/512/1864/1864474.png' },
            { id: 'g9', name: '골묘귀', type: 'ghost', img: 'https://cdn-icons-png.flaticon.com/512/1070/1070313.png' },
            { id: 'g10', name: '어둑시니', type: 'ghost', img: 'https://cdn-icons-png.flaticon.com/512/1162/1162386.png' },
            { id: 'g11', name: '불가살이', type: 'ghost', img: 'https://cdn-icons-png.flaticon.com/512/1070/1070274.png' },
            { id: 'g12', name: '라바나브', type: 'ghost', img: 'https://cdn-icons-png.flaticon.com/512/1070/1070318.png' },
            { id: 'g13', name: '헤론', type: 'ghost', img: 'https://cdn-icons-png.flaticon.com/512/1070/1070248.png' },
            { id: 'g14', name: '마고할망', type: 'ghost', img: 'https://cdn-icons-png.flaticon.com/512/1070/1070327.png' },
            { id: 'g15', name: '진명', type: 'ghost', img: 'https://cdn-icons-png.flaticon.com/512/1162/1162382.png' }
        ];

        // 2. 아이템 10종 데이터 세팅
        const items = [
            { id: 'i1', name: '강림 인형', type: 'item', img: 'https://cdn-icons-png.flaticon.com/512/3082/3082045.png' },
            { id: 'i2', name: '달콤 초콜릿', type: 'item', img: 'https://cdn-icons-png.flaticon.com/512/2454/2454314.png' },
            { id: 'i3', name: '마법 고스트볼', type: 'item', img: 'https://cdn-icons-png.flaticon.com/512/1141/1141970.png' },
            { id: 'i4', name: '퇴마 부적', type: 'item', img: 'https://cdn-icons-png.flaticon.com/512/2614/2614368.png' },
            { id: 'i5', name: '할머니 엿', type: 'item', img: 'https://cdn-icons-png.flaticon.com/512/6491/6491517.png' },
            { id: 'i6', name: '정화의 소금', type: 'item', img: 'https://cdn-icons-png.flaticon.com/512/4113/4113944.png' },
            { id: 'i7', name: '악령퇴치 팥', type: 'item', img: 'https://cdn-icons-png.flaticon.com/512/1134/1134447.png' },
            { id: 'i8', name: '영혼 카메라', type: 'item', img: 'https://cdn-icons-png.flaticon.com/512/685/685655.png' },
            { id: 'i9', name: '신비 랜턴', type: 'item', img: 'https://cdn-icons-png.flaticon.com/512/3254/3254425.png' },
            { id: 'i10', name: '고스트 지도', type: 'item', img: 'https://cdn-icons-png.flaticon.com/512/854/854878.png' }
        ];

        let collected = JSON.parse(localStorage.getItem('collected_v4') || '[]');
        let isAppeared = false;
        let lastAlpha = 0;

        async function start() {
            try {
                const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                v.srcObject = s;
            } catch(e) {
                alert("카메라 권한을 허용해주셔야 귀신 탐지가 가능합니다!");
            }

            // GPS 감지 (이동 시)
            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition(pos => {
                    if (!isAppeared && Math.random() > 0.7) triggerAppearance();
                }, null, { enableHighAccuracy: true });
            }

            // 회전 감지 (제자리에서 화면 돌릴 시)
            if (window.DeviceOrientationEvent) {
                window.addEventListener('deviceorientation', (e) => {
                    let diff = Math.abs(e.alpha - lastAlpha);
                    if (diff > 35 && !isAppeared) {
                        if (Math.random() > 0.94) triggerAppearance();
                        lastAlpha = e.alpha;
                    }
                });
            }
        }

        function triggerAppearance() {
            isAppeared = true;
            const isGhost = Math.random() > 0.4;
            const pool = isGhost ? ghosts : items;
            const res = pool[Math.floor(Math.random() * pool.length)];

            target.src = res.img;
            target.dataset.id = res.id;
            target.dataset.name = res.name;
            target.style.display = 'block';
            target.style.filter = isGhost ? 'drop-shadow(0 0 15px red)' : 'drop-shadow(0 0 15px gold)';
            msg.innerText = `앗! [${res.name}] 발견!`;
        }

        target.onclick = () => {
            const id = target.dataset.id;
            if (!collected.includes(id)) {
                collected.push(id);
                localStorage.setItem('collected_v4', JSON.stringify(collected));
            }
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.7 } });
            target.style.display = 'none';
            msg.innerText = "수집 완료!";
            setTimeout(() => { isAppeared = false; msg.innerText = "다시 탐색 중..."; }, 3000);
        };

        let currentTab = 'g';
        function showBook() {
            document.getElementById('book-screen').style.display = 'block';
            renderGrid();
        }
        function closeBook() { document.getElementById('book-screen').style.display = 'none'; }
        function switchTab(t) {
            currentTab = t;
            document.getElementById('tab-g').className = t === 'g' ? 'tab active' : 'tab';
            document.getElementById('tab-i').className = t === 'i' ? 'tab active' : 'tab';
            renderGrid();
        }

        function renderGrid() {
            const grid = document.getElementById('grid-content');
            const data = currentTab === 'g' ? ghosts : items;
            grid.innerHTML = data.map(d => {
                const hasIt = collected.includes(d.id);
                return `
                    <div class="item-slot" style="border-color: ${hasIt ? '#0f0' : '#333'}; opacity: ${hasIt ? 1 : 0.2}">
                        <img src="${d.img}" width="40" style="margin-bottom:5px;">
                        <span style="font-size:9px;">${hasIt ? d.name : '???'}</span>
                    </div>
                `;
            }).join('');
        }

        window.onload = start;
    </script>
</body>
</html>
