<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>신비아파트: 고스트 헌터 ULTIMATE</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body,html{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Black Han Sans',sans-serif;}

#v{position:fixed;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:1;}
#fakebg{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse at 30% 40%,#0d0020 0%,#000 70%);display:none;}
#scanline{position:fixed;inset:0;z-index:2;pointer-events:none;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,255,0,0.01) 3px,rgba(0,255,0,0.01) 4px);}

/* 레이더 */
#radar{position:fixed;top:0;left:0;right:0;height:3px;z-index:10;}
#radar-fill{height:100%;width:0%;background:#0f0;box-shadow:0 0 6px #0f0;transition:width 0.1s;}

/* 상단 HUD */
#hud-top{position:fixed;top:5px;left:0;right:0;padding:0 8px;z-index:10;display:flex;flex-direction:column;gap:4px;}
#hud-row1{display:flex;justify-content:space-between;align-items:center;}
#hud-row2{display:flex;justify-content:space-between;align-items:center;}
.hud-box{background:rgba(0,0,0,0.75);border:1px solid rgba(255,255,255,0.2);border-radius:6px;padding:3px 8px;font-size:11px;color:#fff;}
#det{border-color:#0f0;color:#0f0;}
#gold-box{border-color:#ffd700;color:#ffd700;}
#exp-wrap{flex:1;margin:0 6px;}
#exp-bar-bg{background:rgba(255,255,255,0.1);border-radius:4px;height:6px;position:relative;overflow:hidden;}
#exp-bar{height:100%;background:linear-gradient(90deg,#00aaff,#00ffaa);border-radius:4px;transition:width 0.3s;}
#lv-label{font-size:10px;color:#00ffaa;text-align:center;margin-bottom:1px;}

/* 위험 */
#danger{position:fixed;inset:0;z-index:6;pointer-events:none;opacity:0;border:6px solid red;box-shadow:inset 0 0 80px rgba(255,0,0,0.55);}
#danger.on{animation:dpulse 0.4s ease-in-out 4;}
@keyframes dpulse{0%,100%{opacity:0;}50%{opacity:1;}}

/* 메시지 */
#msg{position:fixed;top:82px;left:0;right:0;text-align:center;z-index:10;pointer-events:none;}
#msg span{display:inline-block;background:rgba(0,0,0,0.78);color:#fff;padding:6px 16px;border-radius:18px;font-size:13px;border:1px solid rgba(255,255,255,0.12);}

/* 콤보 */
#combo-display{position:fixed;top:115px;right:10px;z-index:10;text-align:right;pointer-events:none;opacity:0;transition:opacity 0.3s;}
#combo-display.show{opacity:1;}
#combo-num{font-size:28px;color:#ff6600;text-shadow:0 0 12px #ff6600;line-height:1;}
#combo-label{font-size:10px;color:#ffaa44;}

/* 귀신 등장 영역 */
#battle-area{position:fixed;top:0;left:0;right:0;bottom:0;z-index:8;display:none;align-items:center;justify-content:center;flex-direction:column;}
#battle-area.active{display:flex;}

/* 시간바 */
#time-bar-wrap{position:fixed;top:130px;left:10px;right:10px;z-index:11;display:none;}
#time-bar-bg{background:rgba(0,0,0,0.6);border:1px solid rgba(255,255,255,0.2);border-radius:6px;height:10px;overflow:hidden;}
#time-bar{height:100%;background:linear-gradient(90deg,#ff1a1a,#ff8800);border-radius:6px;transition:width 0.1s linear;width:100%;}
#time-label{font-size:10px;color:#fff;text-align:center;margin-bottom:2px;}

/* 귀신 HP바 */
#hp-wrap{position:fixed;top:150px;left:20px;right:20px;z-index:11;display:none;}
#ghost-name-hp{font-size:14px;color:#fff;text-shadow:0 0 8px #f00;margin-bottom:3px;text-align:center;letter-spacing:1px;}
#hp-bar-bg{background:rgba(0,0,0,0.6);border:1px solid rgba(255,100,100,0.4);border-radius:6px;height:14px;overflow:hidden;position:relative;}
#hp-bar{height:100%;background:linear-gradient(90deg,#ff0000,#ff5500);border-radius:6px;transition:width 0.15s;}
#hp-text{position:absolute;top:0;left:0;right:0;text-align:center;font-size:10px;color:#fff;line-height:14px;}

/* 귀신 이미지 */
#ghost-wrap{position:relative;display:flex;align-items:center;justify-content:center;margin-top:40px;}
#ghost-img{
  width:200px;height:200px;object-fit:contain;
  cursor:pointer;user-select:none;
  filter:drop-shadow(0 0 25px #ff0000) drop-shadow(0 0 50px rgba(200,0,0,0.5));
  animation:gfloat 2s ease-in-out infinite;
  transition:filter 0.1s;
}
#ghost-img.hit{animation:ghost-hit 0.15s ease-out,gfloat 2s ease-in-out infinite 0.15s;filter:drop-shadow(0 0 40px #fff) brightness(2);}
@keyframes ghost-hit{0%{transform:scale(1.15) rotate(3deg);}100%{transform:scale(1) rotate(0deg);}}
@keyframes gfloat{0%,100%{transform:translateY(0) rotate(-1.5deg);}50%{transform:translateY(-15px) rotate(1.5deg);}}
#ghost-img.boss{width:240px;height:240px;filter:drop-shadow(0 0 30px #ff0000) drop-shadow(0 0 60px rgba(255,0,0,0.6)) drop-shadow(0 0 2px #ff6600);}

/* 대미지 숫자 */
.dmg-num{
  position:fixed;pointer-events:none;z-index:200;
  font-size:22px;font-weight:bold;color:#fff;
  text-shadow:0 0 8px #f00,2px 2px 0 #000;
  animation:dmg-fly 0.7s ease-out forwards;
}
@keyframes dmg-fly{0%{opacity:1;transform:translateY(0) scale(1);}100%{opacity:0;transform:translateY(-60px) scale(0.6);}}

/* 실패/성공 오버레이 */
#result-overlay{position:fixed;inset:0;z-index:150;display:none;align-items:center;justify-content:center;flex-direction:column;}
#result-overlay.fail{background:rgba(80,0,0,0.92);}
#result-overlay.success{background:rgba(0,0,0,0.85);}
#result-title{font-size:38px;letter-spacing:3px;margin-bottom:16px;}
#result-detail{color:rgba(255,255,255,0.7);font-size:13px;text-align:center;line-height:2;margin-bottom:24px;}
#result-btn{background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.3);color:#fff;padding:12px 36px;border-radius:24px;font-size:16px;font-family:'Black Han Sans',sans-serif;cursor:pointer;}

/* 레벨업 */
#levelup-overlay{position:fixed;inset:0;z-index:160;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(0,0,30,0.92);pointer-events:none;}
#levelup-overlay.show{display:flex;animation:lu-in 0.5s ease-out;}
@keyframes lu-in{from{opacity:0;transform:scale(0.5);}to{opacity:1;transform:scale(1);}}
#lu-lv{font-size:52px;color:#ffd700;text-shadow:0 0 20px #ffd700;animation:lu-glow 1s ease-in-out infinite;}
@keyframes lu-glow{0%,100%{text-shadow:0 0 20px #ffd700;}50%{text-shadow:0 0 40px #ffd700,0 0 60px #ff8800;}}
#lu-title{font-size:18px;color:#fff;margin-top:8px;letter-spacing:2px;}
#lu-sub{font-size:13px;color:rgba(255,255,255,0.6);margin-top:4px;}

/* 셔터 */
#shutter{position:fixed;inset:0;z-index:140;background:#fff;opacity:0;pointer-events:none;}
#shutter.flash{animation:sf 0.45s ease-out forwards;}
@keyframes sf{0%{opacity:0.9;}100%{opacity:0;}}

/* ── 메뉴 화면들 ── */
.screen{position:fixed;inset:0;z-index:100;display:none;overflow-y:auto;padding:16px;background:linear-gradient(155deg,#060010 0%,#120025 100%);}
.screen.show{display:block;}
.screen h1{color:#ffd700;font-size:19px;text-align:center;margin-bottom:4px;text-shadow:0 0 12px #ffd700;letter-spacing:3px;}
.screen .sub{text-align:center;color:rgba(255,255,255,0.3);font-size:10px;margin-bottom:14px;}
.close-btn{display:block;margin:16px auto 6px;padding:12px 46px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);color:#fff;border-radius:26px;font-size:14px;font-family:'Black Han Sans',sans-serif;cursor:pointer;}

/* 도감 */
.tabs{display:flex;gap:7px;margin-bottom:12px;}
.tab{flex:1;padding:8px;text-align:center;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:7px;color:rgba(255,255,255,0.4);font-family:'Black Han Sans',sans-serif;font-size:12px;cursor:pointer;}
.tab.on{background:linear-gradient(135deg,#bb0000,#550000);border-color:#ff2222;color:#fff;box-shadow:0 0 12px rgba(255,0,0,0.3);}
.prog{background:rgba(255,255,255,0.07);border-radius:8px;height:6px;margin-bottom:12px;overflow:hidden;}
.pfill{height:100%;background:linear-gradient(90deg,#ff1a1a,#ff6600);border-radius:8px;transition:width 0.5s;}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;}
.slot{aspect-ratio:0.82;border:1px solid rgba(255,255,255,0.07);border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:5px 2px;position:relative;overflow:hidden;}
.slot.got{background:rgba(255,30,0,0.06);}
.slot .sname{font-size:8px;color:#fff;text-align:center;line-height:1.3;margin-top:3px;}
.slot.nope .sname{color:rgba(255,255,255,0.18);}
.slot .pframe{width:52px;height:58px;background:#0a0a0a;padding:3px 3px 12px 3px;border:1px solid #222;}
.slot .pframe img{width:100%;height:100%;object-fit:contain;}
.slot .lock{font-size:20px;opacity:0.25;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);}
.slot .rlab{font-size:7px;margin-top:2px;}

/* 상점 */
.shop-grid{display:flex;flex-direction:column;gap:10px;}
.shop-item{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:12px;display:flex;align-items:center;gap:12px;}
.shop-item.owned{border-color:rgba(0,255,100,0.3);background:rgba(0,255,100,0.04);}
.shop-item.equipped{border-color:#ffd700;background:rgba(255,215,0,0.06);}
.shop-icon{font-size:32px;min-width:44px;text-align:center;}
.shop-info{flex:1;}
.shop-name{font-size:14px;color:#fff;letter-spacing:1px;}
.shop-desc{font-size:10px;color:rgba(255,255,255,0.4);margin-top:2px;}
.shop-atk{font-size:11px;color:#ff8800;margin-top:2px;}
.shop-btn{padding:8px 14px;border-radius:20px;font-size:12px;font-family:'Black Han Sans',sans-serif;cursor:pointer;border:1px solid;white-space:nowrap;}
.shop-btn.buy{background:rgba(255,215,0,0.15);border-color:#ffd700;color:#ffd700;}
.shop-btn.equip{background:rgba(0,255,100,0.15);border-color:#00ff64;color:#00ff64;}
.shop-btn.equipped-lbl{background:rgba(255,215,0,0.08);border-color:#ffd700;color:#ffd700;cursor:default;}
.shop-btn.disabled{background:rgba(255,255,255,0.04);border-color:rgba(255,255,255,0.15);color:rgba(255,255,255,0.3);cursor:not-allowed;}

/* 강화 */
.upgrade-wrap{display:flex;flex-direction:column;gap:12px;}
.upgrade-card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:12px;}
.upgrade-header{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.upgrade-icon{font-size:28px;}
.upgrade-name{font-size:14px;color:#fff;}
.upgrade-lv{font-size:11px;color:#ffaa00;margin-top:1px;}
.upgrade-atk{font-size:11px;color:#ff8800;margin-top:1px;}
.mat-list{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
.mat-item{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:6px;padding:4px 8px;font-size:10px;color:#fff;display:flex;align-items:center;gap:4px;}
.mat-item.ok{border-color:rgba(0,255,100,0.4);color:#00ff64;}
.mat-item.ng{border-color:rgba(255,0,0,0.3);color:#ff6666;}
.upg-btn{width:100%;padding:9px;background:linear-gradient(135deg,#ff8800,#ff4400);border:none;border-radius:8px;color:#fff;font-size:13px;font-family:'Black Han Sans',sans-serif;cursor:pointer;}
.upg-btn:disabled{background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.3);cursor:not-allowed;}

/* 업적 */
.achiev-list{display:flex;flex-direction:column;gap:8px;}
.achiev-item{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:9px;padding:10px 12px;display:flex;align-items:center;gap:10px;}
.achiev-item.done{border-color:rgba(255,215,0,0.4);background:rgba(255,215,0,0.05);}
.achiev-icon{font-size:24px;min-width:30px;}
.achiev-info{flex:1;}
.achiev-name{font-size:13px;color:#fff;}
.achiev-desc{font-size:10px;color:rgba(255,255,255,0.4);margin-top:2px;}
.achiev-prog{font-size:10px;color:#ffaa44;margin-top:3px;}
.achiev-reward{font-size:10px;color:#ffd700;}

/* 인벤토리 */
.inv-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px;}
.inv-slot{aspect-ratio:1;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px;}
.inv-slot .inv-icon{font-size:24px;}
.inv-slot .inv-name{font-size:7px;color:rgba(255,255,255,0.6);text-align:center;margin-top:2px;line-height:1.2;}
.inv-slot .inv-cnt{font-size:11px;color:#ffd700;font-weight:bold;}

/* 랭킹 */
.rank-list{display:flex;flex-direction:column;gap:8px;}
.rank-item{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:9px;padding:10px 14px;display:flex;align-items:center;gap:10px;}
.rank-num{font-size:18px;min-width:28px;color:rgba(255,255,255,0.4);}
.rank-num.gold{color:#ffd700;}
.rank-num.silver{color:#aaa;}
.rank-num.bronze{color:#cd7f32;}
.rank-info{flex:1;}
.rank-name{font-size:13px;color:#fff;}
.rank-score{font-size:11px;color:#ff8800;margin-top:1px;}

/* 하단 버튼 */
#btns{position:fixed;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:10px;z-index:9;}
.ubtn{background:rgba(0,0,0,0.78);border:1px solid rgba(255,255,255,0.22);color:#fff;padding:10px 14px;border-radius:22px;font-size:12px;font-family:'Black Han Sans',sans-serif;cursor:pointer;backdrop-filter:blur(4px);display:flex;flex-direction:column;align-items:center;gap:1px;}
.ubtn .ubtn-icon{font-size:16px;}
.ubtn .ubtn-lbl{font-size:9px;color:rgba(255,255,255,0.5);}

/* 팝업 토스트 */
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);z-index:200;pointer-events:none;opacity:0;transition:opacity 0.3s;}
#toast.show{opacity:1;}
#toast-inner{background:rgba(0,0,0,0.88);border:1px solid rgba(255,255,255,0.2);color:#fff;padding:8px 18px;border-radius:18px;font-size:13px;white-space:nowrap;}

/* 업적 팝업 */
#achiev-popup{position:fixed;top:100px;left:50%;transform:translateX(-50%);z-index:180;display:none;background:rgba(0,0,0,0.92);border:1px solid #ffd700;border-radius:12px;padding:14px 20px;text-align:center;min-width:220px;}
#achiev-popup.show{display:block;animation:ap-in 0.4s ease-out;}
@keyframes ap-in{from{opacity:0;transform:translateX(-50%) translateY(-20px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}
#ap-icon{font-size:30px;margin-bottom:6px;}
#ap-title{font-size:11px;color:#ffd700;letter-spacing:1px;}
#ap-name{font-size:15px;color:#fff;margin-top:2px;}
#ap-reward{font-size:11px;color:#ffaa44;margin-top:4px;}

/* 특별 이벤트 배너 */
#event-banner{position:fixed;top:85px;left:0;right:0;z-index:11;text-align:center;pointer-events:none;display:none;}
#event-banner span{display:inline-block;background:rgba(100,0,150,0.9);border:1px solid #aa00ff;color:#fff;padding:4px 16px;border-radius:14px;font-size:11px;animation:eb-pulse 2s ease-in-out infinite;}
@keyframes eb-pulse{0%,100%{box-shadow:0 0 8px #aa00ff;}50%{box-shadow:0 0 20px #aa00ff;}}
</style>
</head>
<body>

<div id="fakebg"></div>
<video id="v" autoplay playsinline muted></video>
<div id="scanline"></div>
<div id="radar"><div id="radar-fill"></div></div>

<!-- HUD -->
<div id="hud-top">
  <div id="hud-row1">
    <div class="hud-box" id="det">👁 탐지중...</div>
    <div class="hud-box" id="title-box">🔰 초보 헌터</div>
    <div class="hud-box" id="gold-box">💰 0G</div>
  </div>
  <div id="hud-row2">
    <div style="font-size:9px;color:#00ffaa;white-space:nowrap;">Lv.<span id="lv-num">1</span></div>
    <div id="exp-wrap">
      <div id="lv-label">EXP <span id="exp-num">0</span>/<span id="exp-max">100</span></div>
      <div id="exp-bar-bg"><div id="exp-bar" style="width:0%"></div></div>
    </div>
    <div style="font-size:9px;color:#ff8800;white-space:nowrap;">⚔️ <span id="atk-display">10</span></div>
  </div>
</div>

<div id="danger"></div>
<div id="msg"><span id="msgtxt">📡 주변을 탐색하세요!</span></div>
<div id="combo-display"><div id="combo-num">0</div><div id="combo-label">COMBO!</div></div>
<div id="event-banner"><span id="event-txt">🌙 자정의 귀신이 출현했다!</span></div>

<!-- 시간바 + HP바 -->
<div id="time-bar-wrap">
  <div id="time-label">⏱ 남은 시간</div>
  <div id="time-bar-bg"><div id="time-bar"></div></div>
</div>
<div id="hp-wrap">
  <div id="ghost-name-hp">???</div>
  <div id="hp-bar-bg">
    <div id="hp-bar" style="width:100%"></div>
    <div id="hp-text">100 / 100</div>
  </div>
</div>

<!-- 전투 -->
<div id="battle-area">
  <div id="ghost-wrap">
    <img id="ghost-img" src="" alt="">
  </div>
</div>

<div id="shutter"></div>

<!-- 결과 -->
<div id="result-overlay">
  <div id="result-title"></div>
  <div id="result-detail"></div>
  <button id="result-btn" onclick="closeResult()">확인</button>
</div>

<!-- 레벨업 -->
<div id="levelup-overlay">
  <div style="font-size:14px;color:#aaa;letter-spacing:2px;margin-bottom:8px;">LEVEL UP!</div>
  <div id="lu-lv">Lv.2</div>
  <div id="lu-title"></div>
  <div id="lu-sub"></div>
</div>

<!-- 업적 팝업 -->
<div id="achiev-popup">
  <div id="ap-icon">🏆</div>
  <div id="ap-title">업적 달성!</div>
  <div id="ap-name"></div>
  <div id="ap-reward"></div>
</div>

<!-- 토스트 -->
<div id="toast"><div id="toast-inner"></div></div>

<!-- 도감 -->
<div id="book-screen" class="screen">
  <h1>👻 고스트 도감</h1>
  <div class="sub">수집한 귀신과 아이템</div>
  <div class="tabs">
    <div id="tg" class="tab on" onclick="switchTab('g')">귀신(30)</div>
    <div id="ti" class="tab" onclick="switchTab('i')">아이템(20)</div>
  </div>
  <div class="prog"><div class="pfill" id="pf" style="width:0%"></div></div>
  <div class="grid" id="grid"></div>
  <button class="close-btn" onclick="closeScreen('book-screen')">닫기</button>
</div>

<!-- 상점 -->
<div id="shop-screen" class="screen">
  <h1>⚔️ 무기 상점</h1>
  <div class="sub">골드로 강력한 무기를 구입하세요</div>
  <div class="shop-grid" id="shop-list"></div>
  <button class="close-btn" onclick="closeScreen('shop-screen')">닫기</button>
</div>

<!-- 강화 -->
<div id="upgrade-screen" class="screen">
  <h1>🔨 무기 강화</h1>
  <div class="sub">강화 아이템으로 무기를 강화하세요 (파괴 없음)</div>
  <div class="upgrade-wrap" id="upgrade-list"></div>
  <button class="close-btn" onclick="closeScreen('upgrade-screen')">닫기</button>
</div>

<!-- 인벤토리 -->
<div id="inv-screen" class="screen">
  <h1>🎒 인벤토리</h1>
  <div class="sub">보유 강화 재료 아이템</div>
  <div class="inv-grid" id="inv-grid"></div>

function getCurWeapon(){return WEAPONS.find(w=>w.id===save.equippedWeapon)||WEAPONS[0];}
function getWeaponLv(wid){return (save.weapons[wid]&&save.weapons[wid].lv)||1;}
function getWeaponAtk(wid){
  const w=WEAPONS.find(x=>x.id===wid);if(!w)return 10;
  const lv=getWeaponLv(wid);
  return Math.floor(w.atk*(1+0.15*(lv-1)));
}
function getPlayerAtk(){return getWeaponAtk(save.equippedWeapon);}

//  게임 시작

async function start(){
  const video=document.getElementById('v');
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});
    video.srcObject=stream;
    await video.play();
    document.getElementById('det').textContent='👁 탐지중...';
  }catch(e){
    video.style.display='none';
    document.getElementById('fakebg').style.display='block';
    document.getElementById('det').textContent='⚠ 카메라 없음';
  }

  updateHUD();
  radarLoop();

  if('geolocation' in navigator)
    navigator.geolocation.watchPosition(()=>{if(!appeared&&Math.random()>0.65)spawnGhost();},null,{enableHighAccuracy:true});
  if(window.DeviceOrientationEvent){
    let la=0;
    window.addEventListener('deviceorientation',e=>{
      if(!e.alpha)return;
      if(Math.abs(e.alpha-la)>30&&!appeared){if(Math.random()>0.91)spawnGhost();la=e.alpha;}
    });
  }

  // 귀신 이미지 터치
  document.getElementById('ghost-img').addEventListener('touchstart',handleHit,{passive:false});
  document.getElementById('ghost-img').addEventListener('mousedown',handleHit);
}

//  레이더
// ════════════════════════════════════════
let radarV=0,radarDir=1;
function radarLoop(){
  radarV+=radarDir*(Math.random()*2.2);
  if(radarV>=100){radarV=100;radarDir=-1;}
  if(radarV<=0){radarV=0;radarDir=1;}
  document.getElementById('radar-fill').style.width=radarV+'%';
  const d=document.getElementById('det');
  if(radarV<30)d.textContent='👁 탐지중...';
  else if(radarV<60)d.textContent='⚡ 반응 감지!';
  else if(radarV<85)d.textContent='⚠️ 접근 중!';
  else d.textContent='🚨 출현 임박!';
  if(radarV>=99&&!appeared)spawnGhost();
  setTimeout(radarLoop,80);
}

function checkSpecialEvents(){
  // 3% 확률로 특별 귀신 이벤트 발동 (시간/날씨 무관)
  if(Math.random()<0.03){
    isSpecialRandom=true;
    const msgs=['🌟 신비한 기운이 느껴진다!','⚡ 강력한 귀신의 기척이!','🔮 희귀한 귀신이 숨어있다!','💫 특별한 존재가 나타날 것 같다!'];
    document.getElementById('event-banner').style.display='block';
    document.getElementById('event-txt').textContent=msgs[Math.floor(Math.random()*msgs.length)];
    setTimeout(()=>{document.getElementById('event-banner').style.display='none';isSpecialRandom=false;},8000);
  }
}

// ════════════════════════════════════════
//  귀신 소환
// ════════════════════════════════════════
function spawnGhost(){
  appeared=true; radarV=0; sessionScore=0;
  // 매 소환마다 3% 확률로 특별 이벤트
  checkSpecialEvents();

  // 귀신 풀 결정
  let pool=[...ghosts];
  // 특별 이벤트면 legendary/epic 확률 UP
  if(isSpecialRandom) pool=[...pool,...ghosts.filter(g=>g.rarity==='legendary'),...ghosts.filter(g=>g.rarity==='epic')];
  // 100마리 이상 + 보스 없으면 보스 추가
  if(save.totalCatch>=50) pool=[...pool,...ghosts.filter(g=>g.rarity==='boss')];

  // 희귀도 가중치
  const rand=Math.random();
  let filtered;
  if(rand<0.02&&save.totalCatch>=50) filtered=ghosts.filter(g=>g.rarity==='boss');
  else if(rand<0.06) filtered=ghosts.filter(g=>g.rarity==='legendary');
  else if(rand<0.18) filtered=ghosts.filter(g=>g.rarity==='epic');
  else if(rand<0.45) filtered=ghosts.filter(g=>g.rarity==='rare');
  else filtered=ghosts.filter(g=>g.rarity==='common');
  if(!filtered.length) filtered=ghosts.filter(g=>g.rarity==='common');

  const g=filtered[Math.floor(Math.random()*filtered.length)];
  currentGhost=g;
  maxHp=g.hp; currentHp=g.hp;
  const timeLimit=g.time||(g.rarity==='boss'?60:g.rarity==='legendary'?45:g.rarity==='epic'?30:g.rarity==='rare'?20:15);
  timeLeft=timeLimit;

  // 이미지 세팅
  const img=document.getElementById('ghost-img');
  img.src=makeGhostSVG(g);
  const isBoss=g.rarity==='boss';
  img.className=isBoss?'boss':'';
  const glowMap={common:'#ff3300',rare:'#4488ff',epic:'#cc44ff',legendary:'#ffaa00',boss:'#ff0000'};
  const gc=glowMap[g.rarity]||'#ff3300';
  img.style.filter=`drop-shadow(0 0 ${isBoss?35:20}px ${gc}) drop-shadow(0 0 ${isBoss?60:40}px ${gc}66)`;

  // HP바
  updateHpBar();
  document.getElementById('ghost-name-hp').textContent=`${g.name} ${RL[g.rarity]?'['+RL[g.rarity]+']':''}`;
  document.getElementById('hp-wrap').style.display='block';
  document.getElementById('time-bar-wrap').style.display='block';
  document.getElementById('time-bar').style.width='100%';
  document.getElementById('battle-area').className='active';

  // 위험 플래시
  const dn=document.getElementById('danger');
  dn.className='on'; setTimeout(()=>dn.className='',1800);
  if(navigator.vibrate)navigator.vibrate([150,60,150,60,isBoss?500:200]);
  setMsg(`⚠️ [${g.name}] 출현!`,RC[g.rarity]||'#ff4444');

  // 타이머 시작
  startTimer(timeLimit);

  // 아이템 드롭 (랜덤 출현)
  const rand2=Math.random();
  let itemToDrop=null;
  if(g.rarity==='boss') itemToDrop=items.filter(i=>i.isUpgMat&&i.matGrade>=3)[Math.floor(Math.random()*2)];
  else if(g.rarity==='legendary'&&rand2<0.6) itemToDrop=items.filter(i=>i.isUpgMat&&i.matGrade>=3)[0];
  else if(g.rarity==='epic'&&rand2<0.5) itemToDrop=items.filter(i=>i.isUpgMat&&i.matGrade>=2)[Math.floor(Math.random()*2)];
  else if(g.rarity==='rare'&&rand2<0.4) itemToDrop=items.filter(i=>i.isUpgMat&&i.matGrade===1)[0];
  else if(rand2<0.25) itemToDrop=items.filter(i=>i.isUpgMat&&i.matGrade===1)[Math.floor(Math.random()*2)];
  currentGhost._dropItem=itemToDrop||null;
}

// ════════════════════════════════════════
//  타이머
// ════════════════════════════════════════
function startTimer(total){
  clearInterval(timeTimer);
  timeTimer=setInterval(()=>{
    timeLeft-=0.1;
    const pct=Math.max(0,timeLeft/total*100);
    const tb=document.getElementById('time-bar');
    tb.style.width=pct+'%';
    tb.style.background=pct>50?'linear-gradient(90deg,#ff8800,#ffcc00)':pct>25?'linear-gradient(90deg,#ff4400,#ff8800)':'linear-gradient(90deg,#ff0000,#ff4400)';
    if(timeLeft<=0){
      clearInterval(timeTimer);
      failBattle();
    }
  },100);
}

// ════════════════════════════════════════
//  공격 처리
// ════════════════════════════════════════
function handleHit(e){
  e.preventDefault();
  if(!appeared||!currentGhost)return;
  const atk=getPlayerAtk();
  const dmg=Math.floor(atk*(0.85+Math.random()*0.3));
  currentHp=Math.max(0,currentHp-dmg);
  updateHpBar();

  // 대미지 숫자
  const touch=e.touches?e.touches[0]:e;
  showDmgNum(touch.clientX,touch.clientY,dmg,currentGhost.rarity==='boss');

  // 히트 효과
  const img=document.getElementById('ghost-img');
  img.classList.remove('hit'); void img.offsetWidth; img.classList.add('hit');
  setTimeout(()=>img.classList.remove('hit'),200);
  if(navigator.vibrate)navigator.vibrate(15);

  // 콤보
  combo++;
  clearTimeout(comboTimer);
  comboTimer=setTimeout(()=>{combo=0;document.getElementById('combo-display').className='';},2000);
  if(combo>1){
    const cd=document.getElementById('combo-display');
    document.getElementById('combo-num').textContent=combo+'x';
    cd.className='show';
    if(combo>save.maxCombo){save.maxCombo=combo;}
    checkAchiev('combo',combo);
  }

  if(currentHp<=0) winBattle();
}

function showDmgNum(x,y,dmg,isBoss){
  const el=document.createElement('div');
  el.className='dmg-num';
  el.textContent='-'+dmg;
  el.style.left=(x-20)+'px';
  el.style.top=(y-20)+'px';
  if(isBoss){el.style.fontSize='28px';el.style.color='#ff8800';}
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),750);
}

function updateHpBar(){
  const pct=Math.max(0,currentHp/maxHp*100);
  document.getElementById('hp-bar').style.width=pct+'%';
  document.getElementById('hp-bar').style.background=pct>50?'linear-gradient(90deg,#ff0000,#ff5500)':pct>25?'linear-gradient(90deg,#ff4400,#ff8800)':'linear-gradient(90deg,#ff8800,#ffcc00)';
  document.getElementById('hp-text').textContent=`${currentHp} / ${maxHp}`;
}

// ════════════════════════════════════════
//  전투 결과
// ════════════════════════════════════════
function winBattle(){
  clearInterval(timeTimer);
  const g=currentGhost;
  const comboBonus=Math.floor(combo*0.5);
  const earnedExp=g.exp+comboBonus;
  const earnedGold=g.gold+Math.floor(combo*g.gold*0.1);

  // 셔터
  const sht=document.getElementById('shutter');
  sht.classList.add('flash');setTimeout(()=>sht.classList.remove('flash'),500);

  // 보상 지급
  save.gold+=earnedGold;
  save.totalGoldEarned+=earnedGold;
  save.totalCatch++;
  sessionScore=earnedGold*10+earnedExp*5;

  // 도감 등록
  if(!save.collected.includes(g.id)) save.collected.push(g.id);

  // 아이템 드롭
  let dropMsg='';
  if(g._dropItem){
    save.inventory[g._dropItem.id]=(save.inventory[g._dropItem.id]||0)+1;
    if(!save.collectedItems.includes(g._dropItem.id)) save.collectedItems.push(g._dropItem.id);
    dropMsg=`\n🎁 ${g._dropItem.icon} ${g._dropItem.name} 획득!`;
  }

  // 스코어 저장
  save.scores.push({name:g.name,score:sessionScore,date:new Date().toLocaleDateString()});
  save.scores.sort((a,b)=>b.score-a.score);
  if(save.scores.length>20)save.scores=save.scores.slice(0,20);

  // 업적 체크
  checkAchiev('catch',1);
  checkAchiev('catchTotal',save.totalCatch);
  checkAchiev('collect',save.collected.length);
  checkAchiev('goldTotal',save.totalGoldEarned);
  if(g.rarity==='legendary')checkAchiev('legendary',1);
  if(g.rarity==='boss')checkAchiev('boss',1);
  if(g.rarity==='epic')checkAchiev('epic',1);
  if(isSpecialRandom)checkAchiev('special',1);

  // 경험치
  addExp(earnedExp);
  saveSave();
  updateHUD();

  // 결과 화면
  endBattleUI();
  confetti({particleCount:100,spread:70,origin:{y:0.6},colors:['#ff1a1a','#ff6600','#ffd700','#fff']});

  const ro=document.getElementById('result-overlay');
  ro.className='success';
  document.getElementById('result-title').textContent='🎉 포획 성공!';
  document.getElementById('result-title').style.color='#ffd700';
  document.getElementById('result-detail').innerHTML=
    `<b style="color:#fff">${g.name}</b> [${RL[g.rarity]}]<br>`+
    `💰 +${earnedGold}G &nbsp; ⭐ +${earnedExp} EXP<br>`+
    `🔥 콤보 보너스: +${comboBonus} EXP${dropMsg}`;
  ro.style.display='flex';
}

function failBattle(){
  endBattleUI();
  if(navigator.vibrate)navigator.vibrate([300,100,300]);
  const ro=document.getElementById('result-overlay');
  ro.className='fail';
  document.getElementById('result-title').textContent='💀 실패!';
  document.getElementById('result-title').style.color='#ff4444';
  document.getElementById('result-detail').innerHTML=
    `<b style="color:#ff8888">${currentGhost.name}</b>을 놓쳤다...<br>시간이 초과되었습니다.<br><br>더 빠르게 공격하세요!`;
  ro.style.display='flex';
  setMsg('실패...','#ff4444');
}

function endBattleUI(){
  document.getElementById('battle-area').className='';
  document.getElementById('hp-wrap').style.display='none';
  document.getElementById('time-bar-wrap').style.display='none';
  combo=0;
  document.getElementById('combo-display').className='';
}

function closeResult(){

}

// ════════════════════════════════════════
//  경험치/레벨
// ════════════════════════════════════════
function addExp(amount){
  save.exp+=amount;
  let lv=save.lv;
  while(lv<LEVELS.length&&save.exp>=LEVELS[lv-1].exp){
    save.exp-=LEVELS[lv-1].exp;
    lv++;
    showLevelUp(lv);
  }
  save.lv=lv;
  checkAchiev('level',save.lv);
}

function showLevelUp(lv){
  const info=LEVELS[lv-1]||LEVELS[LEVELS.length-1];
  const el=document.getElementById('levelup-overlay');
  document.getElementById('lu-lv').textContent='Lv.'+lv;
  document.getElementById('lu-title').textContent=info.title;
  document.getElementById('lu-sub').textContent='공격력 +15% 증가!';
  el.className='show';
  confetti({particleCount:150,spread:100,origin:{y:0.5},colors:['#ffd700','#ffaa00','#ff8800','#fff']});
  setTimeout(()=>el.className='',3000);
}

// ════════════════════════════════════════
//  업적
// ════════════════════════════════════════
function checkAchiev(type,value){
  ACHIEVS.forEach(a=>{
    if(save.achievDone.includes(a.id))return;
    if(a.type!==type)return;
    const cur=(save.achievs[a.id]||0);
    const next=type==='catchTotal'||type==='goldTotal'||type==='collect'?value:cur+1;
    save.achievs[a.id]=Math.max(cur,type==='combo'?value:next);
    if(save.achievs[a.id]>=a.goal){
      save.achievDone.push(a.id);
      // 보상
      if(a.reward.gold) save.gold+=a.reward.gold;
      if(a.reward.item){
        save.inventory[a.reward.item]=(save.inventory[a.reward.item]||0)+1;
        if(!save.collectedItems.includes(a.reward.item)) save.collectedItems.push(a.reward.item);
      }
      showAchievPopup(a);
      saveSave();
      updateHUD();
    }
  });
}

function showAchievPopup(a){
  const p=document.getElementById('achiev-popup');
  document.getElementById('ap-icon').textContent=a.icon;
  document.getElementById('ap-name').textContent=a.name;
  document.getElementById('ap-reward').textContent=`보상: ${a.reward.gold?'💰'+a.reward.gold+'G':''}${a.reward.item?' '+items.find(i=>i.id===a.reward.item)?.icon:''}`;
  p.className='show';
  setTimeout(()=>p.className='',3500);
}

function updateHUD(){
  const lv=save.lv;
  const info=LEVELS[Math.min(lv-1,LEVELS.length-1)];
  const nextInfo=LEVELS[Math.min(lv,LEVELS.length-1)];
  document.getElementById('lv-num').textContent=lv;
  document.getElementById('title-box').textContent=(info?info.title:'전설의 헌터');
  document.getElementById('gold-box').textContent='💰 '+save.gold.toLocaleString()+'G';
  document.getElementById('atk-display').textContent=getPlayerAtk();
  const maxExp=info?info.exp:9999;
  const pct=Math.min(100,save.exp/maxExp*100);
  document.getElementById('exp-bar').style.width=pct+'%';
  document.getElementById('exp-num').textContent=save.exp;
  document.getElementById('exp-max').textContent=maxExp;
}

function renderShop(){
  const list=document.getElementById('shop-list');
  list.innerHTML='';
  WEAPONS.forEach(w=>{
    const owned=!!save.weapons[w.id];
    const equipped=save.equippedWeapon===w.id;
    const canBuy=!owned&&save.gold>=w.price;
    const lv=getWeaponLv(w.id);
    const atk=getWeaponAtk(w.id);
    const div=document.createElement('div');
    div.className='shop-item'+(equipped?' equipped':owned?' owned':'');
    div.innerHTML=`
      <div class="shop-icon">${w.icon}</div>
      <div class="shop-info">
        <div class="shop-name">${w.name}${lv>1?' +'+lv:''}</div>
        <div class="shop-desc">${w.desc}</div>
        <div class="shop-atk">⚔️ 공격력 ${atk}</div>
      </div>
      ${w.price===0?'<button class="shop-btn equipped-lbl" disabled>기본</button>':
        equipped?'<button class="shop-btn equipped-lbl" disabled>장착중</button>':
        owned?`<button class="shop-btn equip" onclick="equipWeapon('${w.id}')">장착</button>`:
        `<button class="shop-btn buy ${canBuy?'':'disabled'}" onclick="buyWeapon('${w.id}')" ${canBuy?'':'disabled'}>💰${w.price.toLocaleString()}G</button>`}`;
    list.appendChild(div);
  });
}

function buyWeapon(wid){
  const w=WEAPONS.find(x=>x.id===wid);
  if(!w||save.gold<w.price)return showToast('골드가 부족합니다!');
  save.gold-=w.price;
  save.weapons[wid]={lv:1};
  save.equippedWeapon=wid;
  checkAchiev('buy',1);
  saveSave(); updateHUD(); renderShop();
  showToast(`${w.icon} ${w.name} 구매 완료!`);
}

function equipWeapon(wid){
  save.equippedWeapon=wid;
  saveSave(); updateHUD(); renderShop();
  const w=WEAPONS.find(x=>x.id===wid);
  showToast(`${w.icon} ${w.name} 장착!`);
}

// ════════════════════════════════════════
//  강화
// ════════════════════════════════════════
function renderUpgrade(){
  const list=document.getElementById('upgrade-list');
  list.innerHTML='';
  WEAPONS.filter(w=>save.weapons[w.id]&&w.upgReq).forEach(w=>{
    const lv=getWeaponLv(w.id);
    const atk=getWeaponAtk(w.id);
    const nextAtk=Math.floor(w.atk*(1+0.15*lv));
    // 재료 충족 체크
    const canUpgrade=w.upgReq.every(r=>(save.inventory[r.id]||0)>=r.cnt*(lv));
    const div=document.createElement('div');
    div.className='upgrade-card';
    const matHtml=w.upgReq.map(r=>{
      const need=r.cnt*lv;
      const have=save.inventory[r.id]||0;
      const it=items.find(i=>i.id===r.id);
      const ok=have>=need;
      return `<div class="mat-item ${ok?'ok':'ng'}">${it?it.icon:'?'} ${it?it.name:'?'} ${have}/${need}</div>`;
    }).join('');
    div.innerHTML=`
      <div class="upgrade-header">
        <div class="upgrade-icon">${w.icon}</div>
        <div>
          <div class="upgrade-name">${w.name}</div>
          <div class="upgrade-lv">현재 Lv.${lv} → Lv.${lv+1}</div>
          <div class="upgrade-atk">⚔️ ${atk} → ${nextAtk}</div>
        </div>
      </div>
      <div class="mat-list">${matHtml}</div>
      <button class="upg-btn" ${canUpgrade?'':'disabled'} onclick="upgradeWeapon('${w.id}')">
        ${canUpgrade?'🔨 강화하기':'재료 부족'}
      </button>`;
    list.appendChild(div);
  });
  if(!list.children.length)list.innerHTML='<div style="color:rgba(255,255,255,0.4);text-align:center;padding:30px">보유한 무기가 없습니다</div>';
}

function upgradeWeapon(wid){
  const w=WEAPONS.find(x=>x.id===wid);
  const lv=getWeaponLv(wid);
  // 재료 소비
  w.upgReq.forEach(r=>{
    save.inventory[r.id]=(save.inventory[r.id]||0)-r.cnt*lv;
    if(save.inventory[r.id]<0)save.inventory[r.id]=0;
  });
  save.weapons[wid].lv=lv+1;
  checkAchiev('upgrade',1);
  saveSave(); updateHUD(); renderUpgrade();
  showToast(`🔨 ${w.icon} ${w.name} +${lv+1} 강화 성공!`);
}

// ════════════════════════════════════════
//  인벤토리
// ════════════════════════════════════════
function renderInv(){
  const grid=document.getElementById('inv-grid');
  grid.innerHTML='';
  const matItems=items.filter(i=>i.isUpgMat);
  matItems.forEach(it=>{
    const cnt=save.inventory[it.id]||0;
    const div=document.createElement('div');
    div.className='inv-slot';
    div.innerHTML=`<div class="inv-icon">${it.icon}</div><div class="inv-name">${it.name}</div><div class="inv-cnt">${cnt}</div>`;
    grid.appendChild(div);
  });
}

// ════════════════════════════════════════
//  도감
// ════════════════════════════════════════
let currentTab='g';
function switchTab(t){
  currentTab=t;
  document.getElementById('tg').className=t==='g'?'tab on':'tab';
  document.getElementById('ti').className=t==='i'?'tab on':'tab';
  renderGrid();
}
function renderGrid(){
  const data=currentTab==='g'?ghosts:items;
  const collected=currentTab==='g'?save.collected:save.collectedItems;
  const got=data.filter(d=>collected.includes(d.id)).length;
  document.getElementById('pf').style.width=(got/data.length*100)+'%';
  const grid=document.getElementById('grid');grid.innerHTML='';
  data.forEach(d=>{
    const has=collected.includes(d.id);
    const div=document.createElement('div');
    div.className='slot '+(has?'got':'nope');
    const rc=RC[d.rarity||d.rare]||'#aaa';
    if(d.rarity||d.rare)div.style.borderColor=has?(rc+'55'):'rgba(255,255,255,0.07)';
    if(has){
      const frame=document.createElement('div');frame.className='pframe';
      if(currentTab==='g'){
        const img=document.createElement('img');img.src=makeGhostSVG(d);
        img.style.cssText='width:100%;height:100%;object-fit:contain;';
        frame.appendChild(img);
      } else {
        frame.innerHTML=`<div style="font-size:28px;display:flex;align-items:center;justify-content:center;height:100%;padding-bottom:10px">${d.icon||'?'}</div>`;
      }
      div.appendChild(frame);
      const nm=document.createElement('div');nm.className='sname';nm.textContent=d.name;div.appendChild(nm);
      const rl=document.createElement('div');rl.className='rlab';rl.style.color=rc;
      rl.textContent='★ '+(RL[d.rarity||d.rare]||'');div.appendChild(rl);
    } else {
      div.innerHTML='<div class="lock">🔒</div><div class="sname">???</div>';
    }
    grid.appendChild(div);
  });
}

// ════════════════════════════════════════
//  업적
// ════════════════════════════════════════
function renderAchiev(){
  const list=document.getElementById('achiev-list');list.innerHTML='';
  ACHIEVS.forEach(a=>{
    const done=save.achievDone.includes(a.id);
    const prog=save.achievs[a.id]||0;
    const div=document.createElement('div');
    div.className='achiev-item'+(done?' done':'');
    const rewardTxt=a.reward.gold?`💰${a.reward.gold}G`:'';
    const itemR=a.reward.item?items.find(i=>i.id===a.reward.item):null;
    div.innerHTML=`
      <div class="achiev-icon">${a.icon}</div>
      <div class="achiev-info">
        <div class="achiev-name">${done?'✅ ':''} ${a.name}</div>
        <div class="achiev-desc">${a.desc}</div>
        <div class="achiev-prog">${done?'완료!':prog+' / '+a.goal}</div>
      </div>
      <div class="achiev-reward">${rewardTxt}${itemR?' '+itemR.icon:''}</div>`;
    list.appendChild(div);
  });
}

function openScreen(id){document.getElementById(id).className='screen show';}
function closeScreen(id){document.getElementById(id).className='screen';}
function setMsg(t,c='#fff'){const el=document.getElementById('msgtxt');el.textContent=t;el.style.color=c;}
function showToast(msg){
  const el=document.getElementById('toast');
  document.getElementById('toast-inner').textContent=msg;
  el.className='show';setTimeout(()=>el.className='',2200);
}
function manualScan(){if(appeared)return;radarV=96;setMsg('🔦 탐색 중...','#0f0');if(navigator.vibrate)navigator.vibrate(50);}

window.onload=start;
