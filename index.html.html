<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>고스트 헌터: 신비아파트</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
        video { width: 100%; height: 100%; object-fit: cover; position: absolute; }
        
        /* 상단 UI: 잡은 개수 */
        #ui-top { position: absolute; top: 10px; width: 100%; text-align: center; z-index: 100; }
        .counter { background: rgba(0,0,0,0.7); color: #0f0; padding: 5px 15px; border-radius: 20px; border: 1px solid #0f0; font-weight: bold; }

        /* 중앙 메시지 */
        #msg { position: absolute; top: 70px; width: 100%; text-align: center; color: #fff; text-shadow: 2px 2px #000; z-index: 100; font-size: 18px; }

        /* 귀신 본체 */
        #ghost { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 250px; display: none; z-index: 200; cursor: pointer;
            filter: drop-shadow(0 0 15px #0f0); animation: float 2s infinite;
        }
        @keyframes float { 0%, 100% { margin-top: 0; } 50% { margin-top: -30px; } }

        /* 도감 버튼 */
        #book-btn { position: absolute; bottom: 20px; right: 20px; background: #0f0; border: none; padding: 10px; border-radius: 10px; z-index: 100; font-weight: bold; }

        /* 도감 팝업 */
        #collection-screen { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.9); z-index: 300; display: none; color: white;
            overflow-y: auto; padding: 20px; box-sizing: border-box;
        }
    </style>
</head>
<body>

    <video id="v" autoplay playsinline></video>
    <div id="ui-top"><span class="counter">수집된 귀신: <span id="count">0</span> / 15</span></div>
    <div id="msg">이동하며 귀신을 탐지하세요...</div>
    
    <img id="ghost" src="" alt="ghost">

    <button id="book-btn" onclick="showCollection()">도감보기</button>

    <div id="collection-screen">
        <h2>내 고스트 보관함</h2>
        <div id="ghost-list" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;"></div>
        <button onclick="closeCollection()" style="margin-top: 20px; padding: 15px; width: 100%;">닫기</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script>
        const v = document.getElementById('v');
        const ghost = document.getElementById('ghost');
        const msg = document.getElementById('msg');
        const countEl = document.getElementById('count');

        // 1. 귀신 15종 데이터 (이미지는 나중에 신비아파트 png 주소로 바꾸세요!)
        const ghostData = [
            { id: 1, name: "벽수귀", img: "https://cdn-icons-png.flaticon.com/512/1070/1070260.png" },
            { id: 2, name: "흑진귀", img: "https://cdn-icons-png.flaticon.com/512/1070/1070260.png" },
            { id: 3, name: "팬텀토르소", img: "https://cdn-icons-png.flaticon.com/512/1070/1070260.png" },
            // ... (15번까지 이름만 다르게 세팅)
        ];
        // 15개 채우기
        for(let i=4; i<=15; i++) {
            ghostData.push({ id: i, name: "고스트 " + i, img: "https://cdn-icons-png.flaticon.com/512/1070/1070260.png" });
        }

        let myGhosts = JSON.parse(localStorage.getItem('myGhosts') || '[]');
        let lastLat = 0;
        let lastLon = 0;
        let isGhostAppeared = false;

        async function start() {
            // 카메라 시작
            const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            v.srcObject = s;
            updateUI();
            
            // GPS 추적 시작
            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition(checkLocation, (e) => console.log(e), { enableHighAccuracy: true });
            }
        }

        function checkLocation(pos) {
            const lat = pos.coords.latitude;
            const lon = pos.coords.longitude;

            // 처음 위치 저장
            if (lastLat === 0) { lastLat = lat; lastLon = lon; return; }

            // 이전 위치와 현재 위치의 차이 계산 (아주 조금이라도 움직였는지 체크)
            const dist = Math.sqrt(Math.pow(lat - lastLat, 2) + Math.pow(lon - lastLon, 2));

            // 일정 거리 이상 움직였고, 아직 귀신이 안 나타났다면 소환 (랜덤 확률)
            if (dist > 0.00001 && !isGhostAppeared) { 
                if (Math.random() > 0.7) { // 30% 확률로 등장
                    showGhost();
                }
                lastLat = lat; lastLon = lon; // 위치 갱신
            }
        }

        function showGhost() {
            isGhostAppeared = true;
            const randomIdx = Math.floor(Math.random() * ghostData.length);
            const targetGhost = ghostData[randomIdx];

            ghost.src = targetGhost.img;
            ghost.dataset.id = targetGhost.id;
            ghost.dataset.name = targetGhost.name;
            ghost.style.display = 'block';
            msg.innerText = "앗! " + targetGhost.name + "(이)가 나타났다!";
        }

        ghost.onclick = () => {
            const id = parseInt(ghost.dataset.id);
            const name = ghost.dataset.name;

            if (!myGhosts.includes(id)) {
                myGhosts.push(id);
                localStorage.setItem('myGhosts', JSON.stringify(myGhosts));
            }

            confetti({ particleCount: 150, spread: 70 });
            ghost.style.display = 'none';
            msg.innerText = name + " 포획 성공! 보관함을 확인해!";
            isGhostAppeared = false;
            updateUI();
        };

        function updateUI() {
            countEl.innerText = myGhosts.length;
        }

        function showCollection() {
            const listEl = document.getElementById('ghost-list');
            listEl.innerHTML = "";
            ghostData.forEach(g => {
                const hasIt = myGhosts.includes(g.id);
                listEl.innerHTML += `
                    <div style="padding: 10px; border: 1px solid ${hasIt ? '#0f0' : '#444'}; opacity: ${hasIt ? 1 : 0.3}">
                        <img src="${g.img}" width="50"><br>
                        ${hasIt ? g.name : "???"}
                    </div>
                `;
            });
            document.getElementById('collection-screen').style.display = 'block';
        }

        function closeCollection() {
            document.getElementById('collection-screen').style.display = 'none';
        }

        window.onload = start;
    </script>
</body>
</html>
