<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>신비아파트: 고스트 헌터</title>
<style>
    body{margin:0;padding:0;background:#000;color:white;font-family:'Black Han Sans',sans-serif;overflow:hidden;height:100vh;}
    #v{width:100%;height:100%;object-fit:cover;position:fixed;top:0;left:0;z-index:1;}
    #fakebg{width:100%;height:100%;position:fixed;top:0;left:0;background:radial-gradient(#220033,#000);z-index:1;display:none;}
    #tw{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);display:none;flex-direction:column;align-items:center;z-index:10;}
    #ghost-img{width:260px;height:260px;object-fit:contain;cursor:pointer;}
    button{padding:12px 30px;margin:10px;font-size:18px;border-radius:30px;background:#c00;color:white;border:none;}
    #hud{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;z-index:5;}
    .menu{position:fixed;bottom:15px;left:0;right:0;display:flex;justify-content:center;gap:10px;z-index:20;}
</style>
</head>
<body>

<video id="v" autoplay playsinline muted loop></video>
<div id="fakebg"></div>

<div id="hud">
    <div>💰 <span id="money">1250</span></div>
    <div id="det">탐색 중...</div>
</div>

<div id="tw">
    <img id="ghost-img" src="https://i.imgur.com/KfR8vX2.jpeg">
    <div style="margin:15px 0;color:#ff0;font-size:20px;" id="name">진명</div>
    <button onclick="attack()">🔥 공격하기</button>
    <button onclick="hideGhost()">도망</button>
</div>

<div class="menu">
    <button onclick="showBook()">📖 도감</button>
    <button onclick="showInv()">🎒 가방</button>
    <button onclick="trigger()">👻 귀신 소환</button>
</div>

<script>
// 카메라
async function startCam() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({video: true});
    document.getElementById('v').srcObject = stream;
  } catch(e) {
    document.getElementById('v').style.display = 'none';
    document.getElementById('fakebg').style.display = 'block';
  }
}

let money = 1250;
let currentHP = 40;

function trigger() {
  document.getElementById('tw').style.display = 'flex';
  currentHP = 40;
  document.getElementById('name').textContent = "귀신 출현!";
}

function attack() {
  currentHP -= 8;
  const img = document.getElementById('ghost-img');
  img.style.transform = 'scale(0.8)';
  setTimeout(() => img.style.transform = 'scale(1)', 150);
  
  if(currentHP <= 0) {
    alert("🎉 귀신 잡음! +450원");
    money += 450;
    document.getElementById('money').textContent = money;
    hideGhost();
  }
}

function hideGhost() {
  document.getElementById('tw').style.display = 'none';
}

function showBook() { alert("📖 도감\n(나중에 더 추가할게)"); }
function showInv() { alert("🎒 인벤토리\n강화 재료: 3개"); }

window.onload = () => {
  startCam();
  document.getElementById('money').textContent = money;
};
</script>
</body>
</html>
