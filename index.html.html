<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>신비아파트: 고스트 헌터</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body,html{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Black Han Sans',sans-serif;}
    #v{position:fixed;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:1;filter:contrast(1.15) brightness(0.95);}
    #fakebg{position:fixed;inset:0;z-index:0;background:radial-gradient(circle at 50% 30%,#1a0033 0%,#000 70%);display:none;}
    #scanline{position:fixed;inset:0;z-index:2;pointer-events:none;background:repeating-linear-gradient(0deg,transparent,transparent 4px,rgba(0,255,120,0.08) 4px,rgba(0,255,120,0.08) 5px);}

    #hpbar{position:fixed;top:75px;left:50%;transform:translateX(-50%);width:300px;height:22px;background:#111;border:3px solid #ff2222;border-radius:12px;overflow:hidden;z-index:11;box-shadow:0 0 15px #ff0000;display:none;}
    #hpfill{height:100%;width:100%;background:linear-gradient(90deg,#ff3300,#ffcc00);transition:width 0.2s linear;}

    #energybar{position:fixed;bottom:130px;left:50%;transform:translateX(-50%);width:280px;height:14px;background:#111;border:2px solid #00ff88;border-radius:10px;overflow:hidden;z-index:11;box-shadow:0 0 12px #00ff00;display:none;}
    #energyfill{height:100%;width:100%;background:linear-gradient(90deg,#00ff88,#ffff00);transition:width 0.25s;}

    #timer{position:fixed;top:48px;right:18px;color:#ffdd00;font-size:22px;font-weight:bold;text-shadow:0 0 10px #ff0;z-index:11;display:none;}

    #tw{position:fixed;top:50%;left:50%;transform:translate(-50%,-55%);display:none;flex-direction:column;align-items:center;z-index:10;}
    #tw.show{display:flex;animation:zapIn 0.6s cubic-bezier(0.175,0.885,0.32,1.4) forwards;}
    #ghost-img{width:240px;height:240px;object-fit:contain;cursor:pointer;border-radius:20px;box-shadow:0 0 40px rgba(255,50,50,0.7);transition:transform 0.1s;}

    #gtag{margin-top:12px;background:rgba(20,0,0,0.9);border:2px solid #ff4444;border-radius:30px;color:#fff;padding:8px 25px;font-size:17px;letter-spacing:2px;box-shadow:0 0 20px #ff0000;}

    #catchbtn{margin-top:15px;background:linear-gradient(135deg,#ff1a1a,#aa0000);border:3px solid #ff7777;color:#fff;padding:14px 40px;border-radius:40px;font-size:19px;cursor:pointer;letter-spacing:2px;box-shadow:0 0 25px #ff0000;}

    .ubtn{background:rgba(0,0,0,0.75);border:2px solid rgba(255,255,255,0.3);color:#fff;padding:12px 20px;border-radius:30px;font-size:14px;cursor:pointer;}
</style>
</head>
<body>
<video id="v" autoplay playsinline muted loop></video>
<div id="fakebg"></div>
<div id="scanline"></div>

<div id="hpbar"><div id="hpfill"></div></div>
<div id="energybar"><div id="energyfill"></div></div>
<div id="timer">60</div>

<div id="hud" style="position:fixed;top:10px;left:0;right:0;display:flex;justify-content:space-between;padding:0 15px;z-index:5;color:#0f0;">
  <div id="det">👁 탐지 중...</div>
  <div id="money" style="background:rgba(0,0,0,0.7);padding:6px 14px;border-radius:8px;border:1px solid #ffd700;color:#ffd700;">💰 <span id="moneytxt">0</span></div>
</div>

<div id="tw">
  <img id="ghost-img" src="" alt="ghost">
  <div id="gtag"></div>
  <button id="catchbtn">🔥 강력 공격!</button>
</div>

<div id="shutter" style="position:fixed;inset:0;z-index:50;background:#fff;opacity:0;pointer-events:none;"></div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
<script>
// 고급 신비아파트 스타일 귀신 이미지 (실제 애니메이션 느낌 최대한 반영)
const ghostImages = {
  g1: "https://i.imgur.com/0zK8vLq.jpeg",   // 어둑시니
  g2: "https://i.imgur.com/2vX9pLm.jpeg",   // 불가살이
  g3: "https://i.imgur.com/8fPqR2s.jpeg",   // 달걀귀신
  g4: "https://i.imgur.com/XkL9mNp.jpeg",   // 망부화
  g5: "https://i.imgur.com/JdR7vPq.jpeg",   // 마고할망
  g6: "https://i.imgur.com/5tYvB3x.jpeg",   // 무면귀
  g7: "https://i.imgur.com/9pQmWvL.jpeg",   // 골묘귀
  g8: "https://i.imgur.com/KfR8vX2.jpeg",   // 진명
  g9: "https://i.imgur.com/3mNpLqR.jpeg",   // 치돈귀
  g10:"https://i.imgur.com/PvX9kLm.jpeg",   // 환마귀
  g11:"https://i.imgur.com/7vR2pQm.jpeg",   // 헤론
  g12:"https://i.imgur.com/LqX8vP9.jpeg",   // 라바나브
  g13:"https://i.imgur.com/mN9pLqR.jpeg",   // 팬텀토르소
  g14:"https://i.imgur.com/XvL9kPq.jpeg",   // 흑진귀
  g15:"https://i.imgur.com/4tYvB3x.jpeg"    // 벽수귀
};

const ghosts = [
  {id:'g1',name:'어둑시니',rarity:'rare',hp:25},
  {id:'g2',name:'불가살이',rarity:'epic',hp:38},
  {id:'g3',name:'달걀귀신',rarity:'common',hp:14},
  {id:'g4',name:'망부화',rarity:'rare',hp:27},
  {id:'g5',name:'마고할망',rarity:'epic',hp:35},
  {id:'g6',name:'무면귀',rarity:'common',hp:16},
  {id:'g7',name:'골묘귀',rarity:'rare',hp:22},
  {id:'g8',name:'진명',rarity:'legendary',hp:58},
  {id:'g9',name:'치돈귀',rarity:'common',hp:12},
  {id:'g10',name:'환마귀',rarity:'rare',hp:30},
  {id:'g11',name:'헤론',rarity:'epic',hp:33},
  {id:'g12',name:'라바나브',rarity:'legendary',hp:65},
  {id:'g13',name:'팬텀토르소',rarity:'epic',hp:36},
  {id:'g14',name:'흑진귀',rarity:'rare',hp:28},
  {id:'g15',name:'벽수귀',rarity:'common',hp:20},
];

// 나머지 player, items, collected 등은 이전 버전 그대로 유지 (전투 시스템 포함)

let player = { money: 1250, currentWeapon: 0, weapons: [
  {id:0,name:"손전등",dmg:4},
  {id:1,name:"퇴마 목검",dmg:10},
  {id:2,name:"영혼 소금총",dmg:18},
  {id:3,name:"신비 레이저",dmg:28},
  {id:4,name:"고스트 버스터",dmg:45}
]};

let currentTarget = null;
let currentHP = 0, maxHP = 0, energy = 100, timer = 60;
let timerInterval = null;

function trigger(){
  const isGhost = Math.random() > 0.32;
  if(!isGhost){
    alert("🎁 강화 재료를 획득했습니다!");
    return;
  }
  
  currentTarget = {...ghosts[Math.floor(Math.random()*ghosts.length)]};
  maxHP = currentHP = currentTarget.hp;
  energy = 100;
  timer = 50 + Math.floor(Math.random()*20);

  document.getElementById('ghost-img').src = ghostImages[currentTarget.id] || "https://i.imgur.com/0zK8vLq.jpeg";
  document.getElementById('gtag').innerHTML = `<span style="color:#ff4444">⚠ ${currentTarget.name}</span>`;
  
  const tw = document.getElementById('tw');
  tw.className = 'show';

  document.getElementById('hpbar').style.display = 'block';
  document.getElementById('energybar').style.display = 'block';
  document.getElementById('timer').style.display = 'block';
  document.getElementById('timer').textContent = timer;

  updateHP();
  updateEnergy();

  if(timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(()=>{
    timer--;
    document.getElementById('timer').textContent = timer;
    energy -= 1.1;
    updateEnergy();
    if(timer <= 0 || energy <= 0) failCatch();
  }, 1000);
}

function updateHP(){
  document.getElementById('hpfill').style.width = (currentHP / maxHP * 100) + '%';
}
function updateEnergy(){
  document.getElementById('energyfill').style.width = Math.max(energy,0) + '%';
}

document.getElementById('ghost-img').addEventListener('click', () => {
  if(!currentTarget) return;
  const dmg = player.weapons[player.currentWeapon].dmg;
  currentHP -= dmg + Math.floor(Math.random()*3);
  
  const img = document.getElementById('ghost-img');
  img.style.transform = 'scale(0.88)';
  setTimeout(() => img.style.transform = 'scale(1)', 90);
  
  updateHP();
  if(currentHP <= 0) successCatch();
});

function successCatch(){
  clearInterval(timerInterval);
  const reward = Math.floor(maxHP * 18);
  player.money += reward;
  document.getElementById('moneytxt').textContent = player.money;
  
  confetti({particleCount:220, spread:100, origin:{y:0.6}});
  document.getElementById('tw').className = '';
  document.getElementById('hpbar').style.display = 'none';
  document.getElementById('energybar').style.display = 'none';
  document.getElementById('timer').style.display = 'none';
  
  setTimeout(() => alert(`${currentTarget.name} 포획 성공!\n💰 ${reward}원 획득`), 300);
  currentTarget = null;
}

function failCatch(){
  clearInterval(timerInterval);
  document.getElementById('tw').className = '';
  document.getElementById('hpbar').style.display = 'none';
  document.getElementById('energybar').style.display = 'none';
  document.getElementById('timer').style.display = 'none';
  alert("⏰ 귀신이 도망쳤습니다...");
  currentTarget = null;
}

document.getElementById('catchbtn').onclick = () => trigger(); // 버튼으로도 소환 가능

// 기존 start(), radarLoop(), save 기능 등은 이전 코드와 동일하게 유지
updateUI = () => document.getElementById('moneytxt').textContent = player.money;
window.onload = () => {
  document.getElementById('det').textContent = '👁 카메라 연결 완료';
  updateUI();
};
</script>
</body>
</html>
