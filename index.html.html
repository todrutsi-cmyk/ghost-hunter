<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>신비아파트 고스트 탐지기</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; color: #0f0; }
        video { width: 100%; height: 100%; object-fit: cover; position: absolute; }
        #debug-log { 
            position: absolute; top: 10px; left: 10px; right: 10px; 
            background: rgba(0,0,0,0.8); color: #f00; padding: 10px; 
            font-size: 12px; z-index: 1000; border: 1px solid red;
            word-break: break-all;
        }
        #ghost {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 200px; display: none; z-index: 100;
        }
        .ui {
            position: absolute; bottom: 30px; width: 100%; text-align: center;
            z-index: 50; color: #0f0; text-shadow: 2px 2px #000;
        }
    </style>
</head>
<body>

    <!-- 에러 메시지 확인용 창 -->
    <div id="debug-log">카메라 상태 체크 중...</div>

    <video id="v" autoplay playsinline></video>
    
    <img id="ghost" src="https://cdn-icons-png.flaticon.com/512/1070/1070260.png">

    <div class="ui">
        <h2 id="msg">탐지기 가동 중</h2>
        <button onclick="location.reload()" style="padding:10px;">다시 시도</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script>
        const v = document.getElementById('v');
        const log = document.getElementById('debug-log');
        const ghost = document.getElementById('ghost');
        const msg = document.getElementById('msg');

        async function start() {
            log.innerText = "1. 카메라 접근 시도 중...";
            
            // 보안 환경 체크
            if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
                log.innerText = "❌ 보안 에러: 카메라나 마이크는 HTTPS 주소에서만 작동합니다. Vercel에 올려서 테스트하세요!";
                return;
            }

            try {
                const s = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment" } 
                });
                v.srcObject = s;
                log.style.display = "none"; // 성공하면 로그 숨김
                
                // 3초 뒤 귀신 등장
                setTimeout(() => {
                    ghost.style.display = 'block';
                    msg.innerText = "앗! 귀신이다!";
                }, 3000);

            } catch (e) {
                log.innerText = "❌ 에러 발생: " + e.name + "\n메시지: " + e.message;
                console.error(e);
            }
        }

        ghost.onclick = () => {
            confetti();
            ghost.style.display = 'none';
            msg.innerText = "포획 성공!";
            setTimeout(() => { msg.innerText = "다음 귀신 찾는 중..."; start(); }, 3000);
        };

        window.onload = start;
    </script>
</body>
</html>
