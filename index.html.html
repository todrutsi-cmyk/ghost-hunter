<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>신비아파트: 고스트 헌터</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body,html{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Black Han Sans',sans-serif;}

/* 카메라 - 무조건 전체화면 뒤에 */
#v{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  object-fit:cover;
  z-index:1;
  display:block;
}

/* 나머지 전부 z-index 2 이상 */
#scanline{
  position:fixed;inset:0;z-index:2;pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,255,0,0.012) 3px,rgba(0,255,0,0.012) 4px);
}
.corner{position:fixed;width:40px;height:40px;z-index:3;pointer-events:none;opacity:0.7;}
.corner.tl{top:55px;left:12px;border-top:2px solid #0f0;border-left:2px solid #0f0;}
.corner.tr{top:55px;right:12px;border-top:2px solid #0f0;border-right:2px solid #0f0;}
.corner.bl{bottom:90px;left:12px;border-bottom:2px solid #0f0;border-left:2px solid #0f0;}
.corner.br{bottom:90px;right:12px;border-bottom:2px solid #0f0;border-right:2px solid #0f0;}

#radar{position:fixed;top:0;left:0;right:0;height:3px;z-index:4;}
#radar-fill{height:100%;width:0%;background:#0f0;box-shadow:0 0 6px #0f0;transition:width 0.1s;}

#hud{
  position:fixed;top:10px;left:0;right:0;
  display:flex;justify-content:space-between;align-items:center;
  padding:0 12px;z-index:5;
}
#det{background:rgba(0,0,0,0.65);border:1px solid #0f0;border-radius:6px;padding:4px 10px;color:#0f0;font-size:11px;letter-spacing:1px;}
#cnt{background:rgba(0,0,0,0.65);border:1px solid #ffd700;border-radius:6px;padding:4px 10px;color:#ffd700;font-size:11px;}

#danger{position:fixed;inset:0;z-index:6;pointer-events:none;opacity:0;border:5px solid red;box-shadow:inset 0 0 60px rgba(255,0,0,0.5);}
#danger.on{animation:dpulse 0.45s ease-in-out 3 forwards;}
@keyframes dpulse{0%,100%{opacity:0;}50%{opacity:1;}}

#msg{position:fixed;top:48px;left:0;right:0;text-align:center;z-index:7;pointer-events:none;}
#msg span{display:inline-block;background:rgba(0,0,0,0.72);color:#fff;padding:7px 18px;border-radius:20px;font-size:14px;border:1px solid rgba(255,255,255,0.15);}

/* 귀신 */
#tw{
  position:fixed;top:50%;left:50%;
  transform:translate(-50%,-58%);
  display:none;flex-direction:column;align-items:center;
  z-index:10;
}
#tw.show{display:flex;animation:zapIn 0.55s cubic-bezier(0.175,0.885,0.32,1.275) forwards;}
@keyframes zapIn{
  0%{opacity:0;transform:translate(-50%,-58%) scale(0.15) rotate(-20deg);}
  70%{opacity:1;transform:translate(-50%,-58%) scale(1.08) rotate(2deg);}
  100%{opacity:1;transform:translate(-50%,-58%) scale(1) rotate(0);}
}
#gcanvas{width:190px;height:190px;border-radius:50%;animation:gfloat 2.5s ease-in-out infinite;}
@keyframes gfloat{0%,100%{transform:translateY(0) rotate(-2deg);}50%{transform:translateY(-16px) rotate(2deg);}}
#gtag{margin-top:8px;background:rgba(0,0,0,0.85);border:1px solid #f00;border-radius:20px;color:#fff;padding:5px 18px;font-size:15px;text-shadow:0 0 8px red;letter-spacing:2px;}
#catchbtn{margin-top:12px;background:linear-gradient(135deg,#ff1a1a,#880000);border:2px solid #ff5555;color:#fff;padding:11px 30px;border-radius:28px;font-size:17px;font-family:'Black Han Sans',sans-serif;letter-spacing:2px;cursor:pointer;animation:bpulse 1.4s ease-in-out infinite;}
@keyframes bpulse{0%,100%{box-shadow:0 0 18px rgba(255,0,0,0.5);}50%{box-shadow:0 0 32px rgba(255,0,0,0.9);}}

#shutter{position:fixed;inset:0;z-index:50;background:#fff;opacity:0;pointer-events:none;}
#shutter.flash{animation:sf 0.55s ease-out forwards;}
@keyframes sf{0%{opacity:1;}100%{opacity:0;}}

/* 포획 화면 */
#capscreen{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,0.88);display:none;align-items:center;justify-content:center;flex-direction:column;}
.polaroid{background:#fff;padding:10px 10px 48px 10px;border-radius:2px;box-shadow:0 8px 35px rgba(0,0,0,0.9);animation:polin 0.5s cubic-bezier(0.175,0.885,0.32,1.275) forwards;}
@keyframes polin{from{transform:rotate(-4deg) scale(0.2) translateY(80px);opacity:0;}to{transform:rotate(-3deg) scale(1);opacity:1;}}
#pcap{display:block;width:220px;height:220px;}
#pname{text-align:center;margin-top:10px;font-size:17px;color:#222;letter-spacing:2px;}
#ptime{text-align:center;font-size:10px;color:#999;margin-top:3px;font-family:monospace;}
#closecap{margin-top:28px;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.4);color:#fff;padding:12px 40px;border-radius:28px;font-size:15px;font-family:'Black Han Sans',sans-serif;cursor:pointer;}

/* 도감 */
#book{position:fixed;inset:0;z-index:70;background:linear-gradient(155deg,#080010 0%,#150028 100%);display:none;overflow-y:auto;padding:18px;}
#book h1{color:#ffd700;font-size:20px;text-align:center;margin-bottom:4px;text-shadow:0 0 12px #ffd700;letter-spacing:3px;}
#book .sub{text-align:center;color:rgba(255,255,255,0.35);font-size:10px;margin-bottom:14px;}
.tabs{display:flex;gap:8px;margin-bottom:14px;}
.tab{flex:1;padding:9px;text-align:center;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:rgba(255,255,255,0.45);font-family:'Black Han Sans',sans-serif;font-size:13px;cursor:pointer;}
.tab.on{background:linear-gradient(135deg,#cc0000,#660000);border-color:#ff3333;color:#fff;box-shadow:0 0 12px rgba(255,0,0,0.35);}
.prog{background:rgba(255,255,255,0.08);border-radius:8px;height:7px;margin-bottom:14px;overflow:hidden;}
.pfill{height:100%;background:linear-gradient(90deg,#ff1a1a,#ff6600);border-radius:8px;transition:width 0.5s;}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.slot{aspect-ratio:0.82;border:1px solid rgba(255,255,255,0.07);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 3px;position:relative;overflow:hidden;}
.slot.got{border-color:rgba(255,100,0,0.4);background:rgba(255,50,0,0.06);}
.slot .sname{font-size:9px;color:#fff;text-align:center;line-height:1.3;margin-top:4px;}
.slot.nope .sname{color:rgba(255,255,255,0.18);}
.slot .pframe{width:54px;height:62px;background:#fff;padding:3px 3px 14px 3px;}
.slot .lock{font-size:22px;opacity:0.3;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);}
.slot .rlab{font-size:8px;margin-top:2px;}
#bclosebtn{display:block;margin:18px auto 6px;padding:13px 50px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.18);color:#fff;border-radius:28px;font-size:15px;font-family:'Black Han Sans',sans-serif;cursor:pointer;}

#btns{position:fixed;bottom:16px;left:0;right:0;display:flex;justify-content:center;gap:14px;z-index:8;}
.ubtn{background:rgba(0,0,0,0.72);border:1px solid rgba(255,255,255,0.28);color:#fff;padding:11px 18px;border-radius:24px;font-size:13px;font-family:'Black Han Sans',sans-serif;cursor:pointer;backdrop-filter:blur(4px);}

/* 카메라 없을때 가짜 배경 */
#fakebg{
  position:fixed;inset:0;z-index:0;
  background:radial-gradient(ellipse at 30% 40%, #0d0020 0%, #000 70%);
  display:none;
}
</style>
</head>
<body>

<div id="fakebg"></div>
<video id="v" autoplay playsinline muted></video>
<div id="scanline"></div>
<div class="corner tl"></div><div class="corner tr"></div>
<div class="corner bl"></div><div class="corner br"></div>
<div id="radar"><div id="radar-fill"></div></div>
<div id="hud"><div id="det">👁 카메라 연결중...</div><div id="cnt">📖 0 / 25</div></div>
<div id="danger"></div>
<div id="msg"><span id="msgtxt">📡 주변을 탐색하세요!</span></div>

<div id="tw">
  <canvas id="gcanvas" width="190" height="190"></canvas>
  <div id="gtag">???</div>
  <button id="catchbtn" onclick="catchGhost()">📸 잡기!</button>
</div>

<div id="shutter"></div>

<div id="capscreen">
  <div class="polaroid">
    <canvas id="pcap" width="220" height="220"></canvas>
    <div id="pname">귀신</div>
    <div id="ptime"></div>
  </div>
  <button id="closecap" onclick="closeCap()">도감에 저장 ✓</button>
</div>

<div id="book">
  <h1>👻 고스트 도감</h1>
  <div class="sub">신비아파트 귀신 &amp; 아이템 수집록</div>
  <div class="tabs">
    <div id="tg" class="tab on" onclick="switchTab('g')">귀신 (15)</div>
    <div id="ti" class="tab" onclick="switchTab('i')">아이템 (10)</div>
  </div>
  <div class="prog"><div class="pfill" id="pf" style="width:0%"></div></div>
  <div class="grid" id="grid"></div>
  <button id="bclosebtn" onclick="closeBook()">닫기</button>
</div>

<div id="btns">
  <button class="ubtn" onclick="showBook()">📖 도감</button>
  <button class="ubtn" onclick="manualScan()">🔦 탐색</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
<script>
const RC={common:'#aaa',rare:'#4488ff',epic:'#cc44ff',legendary:'#ffaa00'};
const RL={common:'일반',rare:'레어',epic:'에픽',legendary:'전설'};

const ghosts=[
  {id:'g1',name:'어둑시니',rarity:'rare',bg:'#0d0020',face:'#9933cc',accent:'#cc66ff',eyes:'#ff00ff',shape:'spiky'},
  {id:'g2',name:'불가살이',rarity:'epic',bg:'#200000',face:'#cc2200',accent:'#ff6600',eyes:'#ffff00',shape:'flame'},
  {id:'g3',name:'달걀귀신',rarity:'common',bg:'#0a0a0a',face:'#ddddcc',accent:'#bbbbaa',eyes:null,shape:'oval'},
  {id:'g4',name:'망부화',rarity:'rare',bg:'#001020',face:'#aaddff',accent:'#55aadd',eyes:'#ffffff',shape:'weep'},
  {id:'g5',name:'마고할망',rarity:'epic',bg:'#101000',face:'#cc9944',accent:'#886622',eyes:'#ff4400',shape:'old'},
  {id:'g6',name:'무면귀',rarity:'common',bg:'#050505',face:'#cccccc',accent:'#888888',eyes:null,shape:'blank'},
  {id:'g7',name:'골묘귀',rarity:'rare',bg:'#001800',face:'#228833',accent:'#88cc44',eyes:'#ffff00',shape:'cat'},
  {id:'g8',name:'진명',rarity:'legendary',bg:'#100008',face:'#ff0066',accent:'#ff88bb',eyes:'#ffffff',shape:'crown'},
  {id:'g9',name:'치돈귀',rarity:'common',bg:'#0a0800',face:'#cc8833',accent:'#ffcc44',eyes:'#ff6600',shape:'round'},
  {id:'g10',name:'환마귀',rarity:'rare',bg:'#080020',face:'#5544ff',accent:'#aaaaff',eyes:'#00ffff',shape:'wisp'},
  {id:'g11',name:'헤론',rarity:'epic',bg:'#001010',face:'#00ccaa',accent:'#33ffcc',eyes:'#ff0000',shape:'tall'},
  {id:'g12',name:'라바나브',rarity:'legendary',bg:'#200010',face:'#ff2266',accent:'#ff88bb',eyes:'#ffff00',shape:'multi'},
  {id:'g13',name:'팬텀토르소',rarity:'epic',bg:'#050510',face:'#8888ff',accent:'#bbbbff',eyes:'#ff00ff',shape:'half'},
  {id:'g14',name:'흑진귀',rarity:'rare',bg:'#000000',face:'#222222',accent:'#555555',eyes:'#ff0000',shape:'dark'},
  {id:'g15',name:'벽수귀',rarity:'common',bg:'#080808',face:'#886644',accent:'#ccaa66',eyes:'#00ff00',shape:'wall'},
];
const items=[
  {id:'i1',name:'강림 인형',bg:'#ffeecc',icon:'🪆'},
  {id:'i2',name:'달콤 초콜릿',bg:'#3d1a00',icon:'🍫'},
  {id:'i3',name:'마법 고스트볼',bg:'#001144',icon:'🔮'},
  {id:'i4',name:'퇴마 부적',bg:'#ffddaa',icon:'📜'},
  {id:'i5',name:'할머니 엿',bg:'#442200',icon:'🍬'},
  {id:'i6',name:'정화의 소금',bg:'#eeeeff',icon:'🧂'},
  {id:'i7',name:'악령퇴치 팥',bg:'#440000',icon:'🫘'},
  {id:'i8',name:'영혼 카메라',bg:'#111111',icon:'📷'},
  {id:'i9',name:'신비 랜턴',bg:'#332200',icon:'🏮'},
  {id:'i10',name:'고스트 지도',bg:'#334400',icon:'🗺'},
];

function drawGhost(canvas,g,size){
  const ctx=canvas.getContext('2d'),W=size,H=size,cx=W/2,cy=H/2;
  ctx.clearRect(0,0,W,H);
  const bg=ctx.createRadialGradient(cx,cy,10,cx,cy,W/2);
  bg.addColorStop(0,g.bg||'#0a0008');bg.addColorStop(1,'#000');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  for(let i=0;i<600;i++){const x=Math.random()*W,y=Math.random()*H,a=Math.random()*0.1;ctx.fillStyle=`rgba(255,0,0,${a})`;ctx.fillRect(x,y,1,1);}
  const f=g.face||'#aaa',a=g.accent||'#888';
  ctx.save();ctx.shadowColor=f;ctx.shadowBlur=22;
  const shapes={
    spiky:(ctx,cx,cy,f,a)=>{ctx.beginPath();for(let i=0;i<12;i++){const ang=(i/12)*Math.PI*2-Math.PI/2,r=i%2===0?62:38,x=cx+Math.cos(ang)*r,y=cy+Math.sin(ang)*r;i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);}ctx.closePath();ctx.fillStyle=f;ctx.fill();ctx.strokeStyle=a;ctx.lineWidth=2;ctx.stroke();},
    flame:(ctx,cx,cy,f,a)=>{ctx.beginPath();ctx.moveTo(cx,cy-60);ctx.bezierCurveTo(cx+40,cy-30,cx+50,cy+20,cx+10,cy+50);ctx.bezierCurveTo(cx-10,cy+65,cx-20,cy+65,cx-10,cy+50);ctx.bezierCurveTo(cx-50,cy+20,cx-40,cy-30,cx,cy-60);ctx.fillStyle=f;ctx.fill();ctx.beginPath();ctx.moveTo(cx,cy-35);ctx.bezierCurveTo(cx+20,cy-10,cx+22,cy+25,cx,cy+35);ctx.bezierCurveTo(cx-22,cy+25,cx-20,cy-10,cx,cy-35);ctx.fillStyle=a;ctx.fill();},
    oval:(ctx,cx,cy,f,a)=>{ctx.beginPath();ctx.ellipse(cx,cy,45,60,0,0,Math.PI*2);ctx.fillStyle=f;ctx.fill();ctx.strokeStyle=a;ctx.lineWidth=2;ctx.stroke();ctx.beginPath();ctx.moveTo(cx-15,cy+15);ctx.lineTo(cx+15,cy+15);ctx.strokeStyle='#555';ctx.lineWidth=3;ctx.stroke();},
    weep:(ctx,cx,cy,f,a)=>{ctx.beginPath();ctx.ellipse(cx,cy-5,42,55,0,0,Math.PI*2);ctx.fillStyle=f;ctx.fill();[cx-16,cx+16].forEach(tx=>{ctx.beginPath();ctx.moveTo(tx,cy+5);ctx.quadraticCurveTo(tx+4,cy+25,tx,cy+40);ctx.strokeStyle=a;ctx.lineWidth=3;ctx.stroke();});},
    old:(ctx,cx,cy,f,a)=>{ctx.beginPath();ctx.moveTo(cx,cy-55);ctx.lineTo(cx+35,cy-30);ctx.quadraticCurveTo(cx+55,cy,cx+40,cy+40);ctx.quadraticCurveTo(cx+20,cy+65,cx,cy+60);ctx.quadraticCurveTo(cx-20,cy+65,cx-40,cy+40);ctx.quadraticCurveTo(cx-55,cy,cx-35,cy-30);ctx.closePath();ctx.fillStyle=f;ctx.fill();for(let i=0;i<4;i++){ctx.beginPath();ctx.moveTo(cx-25,cy-10+i*15);ctx.lineTo(cx+25,cy-10+i*15);ctx.strokeStyle=a+'88';ctx.lineWidth=1.5;ctx.stroke();}},
    blank:(ctx,cx,cy,f,a)=>{ctx.beginPath();ctx.ellipse(cx,cy,44,55,0,0,Math.PI*2);const gr=ctx.createRadialGradient(cx,cy,5,cx,cy,55);gr.addColorStop(0,f);gr.addColorStop(1,'#333');ctx.fillStyle=gr;ctx.fill();},
    cat:(ctx,cx,cy,f,a)=>{ctx.beginPath();ctx.ellipse(cx,cy+5,42,48,0,0,Math.PI*2);ctx.fillStyle=f;ctx.fill();[[cx-30,cy-45,0],[cx+30,cy-45,1]].forEach(([ex,ey,i])=>{ctx.beginPath();ctx.moveTo(ex,ey+20);ctx.lineTo(ex+(i===0?-18:18),ey-15);ctx.lineTo(ex+(i===0?18:-18),ey-15);ctx.closePath();ctx.fillStyle=f;ctx.fill();ctx.strokeStyle=a;ctx.lineWidth=1.5;ctx.stroke();});[[cx-15,cy+5,cx-55,cy-5],[cx-15,cy+10,cx-55,cy+15],[cx+15,cy+5,cx+55,cy-5],[cx+15,cy+10,cx+55,cy+15]].forEach(([x1,y1,x2,y2])=>{ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle=a+'88';ctx.lineWidth=1;ctx.stroke();});},
    crown:(ctx,cx,cy,f,a)=>{ctx.beginPath();ctx.ellipse(cx,cy+10,44,52,0,0,Math.PI*2);ctx.fillStyle=f;ctx.fill();ctx.beginPath();ctx.moveTo(cx-30,cy-38);ctx.lineTo(cx-30,cy-68);ctx.lineTo(cx-15,cy-52);ctx.lineTo(cx,cy-72);ctx.lineTo(cx+15,cy-52);ctx.lineTo(cx+30,cy-68);ctx.lineTo(cx+30,cy-38);ctx.closePath();ctx.fillStyle=a;ctx.fill();ctx.strokeStyle=f;ctx.lineWidth=2;ctx.stroke();},
    round:(ctx,cx,cy,f,a)=>{ctx.beginPath();ctx.arc(cx,cy,50,0,Math.PI*2);ctx.fillStyle=f;ctx.fill();ctx.strokeStyle=a;ctx.lineWidth=2;ctx.stroke();},
    wisp:(ctx,cx,cy,f,a)=>{for(let i=0;i<3;i++){const ox=(i-1)*30,oy=i===1?-10:10,r=i===1?35:22;ctx.beginPath();ctx.arc(cx+ox,cy+oy,r,0,Math.PI*2);ctx.fillStyle=i===1?f:a;ctx.globalAlpha=0.75;ctx.fill();ctx.globalAlpha=1;}},
    tall:(ctx,cx,cy,f,a)=>{ctx.beginPath();ctx.ellipse(cx,cy,32,65,0,0,Math.PI*2);ctx.fillStyle=f;ctx.fill();ctx.strokeStyle=a;ctx.lineWidth=2;ctx.stroke();},
    multi:(ctx,cx,cy,f,a)=>{[[cx,cy-20,32],[cx-28,cy+25,22],[cx+28,cy+25,22]].forEach(([x,y,r])=>{ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=f;ctx.fill();ctx.strokeStyle=a;ctx.lineWidth=1.5;ctx.stroke();});},
    half:(ctx,cx,cy,f,a)=>{ctx.beginPath();ctx.ellipse(cx,cy-10,44,44,0,0,Math.PI*2);ctx.fillStyle=f;ctx.fill();for(let x=cx-50;x<cx+50;x+=8){ctx.beginPath();ctx.moveTo(x,cy+35);ctx.lineTo(x+4,cy+35);ctx.strokeStyle=a+'aa';ctx.lineWidth=2;ctx.stroke();}},
    dark:(ctx,cx,cy,f,a)=>{ctx.beginPath();ctx.moveTo(cx,cy-60);ctx.bezierCurveTo(cx+55,cy-45,cx+55,cy+45,cx,cy+65);ctx.bezierCurveTo(cx-55,cy+45,cx-55,cy-45,cx,cy-60);ctx.fillStyle=f;ctx.fill();ctx.shadowColor=a;ctx.shadowBlur=30;ctx.strokeStyle=a;ctx.lineWidth=1;ctx.stroke();},
    wall:(ctx,cx,cy,f,a)=>{ctx.beginPath();ctx.ellipse(cx,cy,50,55,0,0,Math.PI*2);ctx.fillStyle=f;ctx.fill();ctx.fillStyle=a+'33';for(let row=0;row<5;row++){const off=row%2===0?0:20;for(let col=-1;col<4;col++)ctx.fillRect(cx-60+col*40+off,cy-55+row*22,35,18);}},
  };
  (shapes[g.shape]||shapes.round)(ctx,cx,cy,f,a);
  ctx.restore();
  if(g.eyes){
    ctx.shadowColor=g.eyes;ctx.shadowBlur=12;ctx.fillStyle=g.eyes;
    const ey=cy-8;
    [[cx-18,ey],[cx+18,ey]].forEach(([ex,ey2])=>{ctx.beginPath();ctx.arc(ex,ey2,6,0,Math.PI*2);ctx.fill();ctx.fillStyle='#000';ctx.beginPath();ctx.arc(ex,ey2,3,0,Math.PI*2);ctx.fill();ctx.fillStyle=g.eyes;});
    ctx.shadowBlur=0;
  }
  const vin=ctx.createRadialGradient(cx,cy,W*0.25,cx,cy,W*0.65);
  vin.addColorStop(0,'transparent');vin.addColorStop(1,'rgba(0,0,0,0.65)');
  ctx.fillStyle=vin;ctx.fillRect(0,0,W,H);
}

function drawItem(canvas,item){
  const ctx=canvas.getContext('2d'),W=canvas.width,H=canvas.height,cx=W/2,cy=H/2;
  ctx.clearRect(0,0,W,H);
  const gr=ctx.createRadialGradient(cx,cy,10,cx,cy,W/2);
  gr.addColorStop(0,item.bg||'#111');gr.addColorStop(1,'#000');
  ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
  ctx.font=`${W*0.45}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(item.icon||'?',cx,cy);
  const vin=ctx.createRadialGradient(cx,cy,W*0.2,cx,cy,W*0.65);
  vin.addColorStop(0,'transparent');vin.addColorStop(1,'rgba(0,0,0,0.6)');
  ctx.fillStyle=vin;ctx.fillRect(0,0,W,H);
}

let collected=JSON.parse(localStorage.getItem('shinbi_v5')||'[]');
let appeared=false,currentTarget=null,currentTab='g';
let radarV=0,radarDir=1;

async function start(){
  const video=document.getElementById('v');
  try{
    const stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}}
    });
    video.srcObject=stream;
    video.onloadedmetadata=()=>video.play();
    document.getElementById('det').textContent='👁 탐지중...';
  }catch(e){
    console.warn('카메라 오류:',e);
    video.style.display='none';
    document.getElementById('fakebg').style.display='block';
    document.getElementById('det').textContent='⚠ 카메라 없음';
  }
  updateCnt();
  radarLoop();
  if('geolocation' in navigator){
    navigator.geolocation.watchPosition(()=>{if(!appeared&&Math.random()>0.65)trigger();},null,{enableHighAccuracy:true});
  }
  if(window.DeviceOrientationEvent){
    let la=0;
    window.addEventListener('deviceorientation',e=>{
      if(!e.alpha)return;
      if(Math.abs(e.alpha-la)>30&&!appeared){if(Math.random()>0.91)trigger();la=e.alpha;}
    });
  }
}

function radarLoop(){
  radarV+=radarDir*(Math.random()*2.2);
  if(radarV>=100){radarV=100;radarDir=-1;}
  if(radarV<=0){radarV=0;radarDir=1;}
  document.getElementById('radar-fill').style.width=radarV+'%';
  const d=document.getElementById('det');
  if(radarV<30)d.textContent='👁 탐지중...';
  else if(radarV<60)d.textContent='⚡ 반응 감지!';
  else if(radarV<85)d.textContent='⚠️ 접근 중!';
  else d.textContent='🚨 출현 임박!';
  if(radarV>=99&&!appeared)trigger();
  setTimeout(radarLoop,80);
}

function trigger(){
  appeared=true;radarV=0;
  const isGhost=Math.random()>0.38;
  const pool=isGhost?ghosts:items;
  currentTarget={...pool[Math.floor(Math.random()*pool.length)],isGhost};
  const gc=document.getElementById('gcanvas');
  if(isGhost)drawGhost(gc,currentTarget,190);
  else drawItem(gc,currentTarget);
  gc.style.filter=isGhost
    ?'drop-shadow(0 0 18px #f00) drop-shadow(0 0 35px rgba(255,0,0,0.4))'
    :'drop-shadow(0 0 18px #ffd700) drop-shadow(0 0 35px rgba(255,215,0,0.4))';
  document.getElementById('gtag').textContent=currentTarget.name;
  const tw=document.getElementById('tw');
  tw.className='';void tw.offsetWidth;tw.className='show';
  const dn=document.getElementById('danger');
  dn.className='on';setTimeout(()=>dn.className='',1500);
  if(navigator.vibrate)navigator.vibrate([100,50,100,50,200]);
  setMsg(`⚠️ [${currentTarget.name}] 출현!`,'#ff4444');
}

function catchGhost(){
  if(!currentTarget||!appeared)return;
  const res=currentTarget;
  const sht=document.getElementById('shutter');
  sht.classList.add('flash');setTimeout(()=>sht.classList.remove('flash'),600);
  if(navigator.vibrate)navigator.vibrate([25,10,25]);
  document.getElementById('tw').className='';
  if(!collected.includes(res.id)){collected.push(res.id);localStorage.setItem('shinbi_v5',JSON.stringify(collected));}
  updateCnt();
  setTimeout(()=>showPolaroid(res),280);
}

function showPolaroid(res){
  const canvas=document.getElementById('pcap');
  if(res.isGhost)drawGhost(canvas,res,220);
  else drawItem(canvas,res);
  const ctx=canvas.getContext('2d');
  const now=new Date();
  const ds=`${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')}`;
  ctx.font='11px monospace';ctx.fillStyle='rgba(255,255,255,0.55)';ctx.textAlign='center';ctx.fillText(ds,110,208);
  if(res.rarity){ctx.font='bold 10px monospace';ctx.fillStyle=RC[res.rarity]||'#fff';ctx.textAlign='left';ctx.fillText(`★ ${RL[res.rarity]||''}`,10,208);}
  document.getElementById('pname').textContent=res.name;
  document.getElementById('ptime').textContent=`${ds} 포획 완료`;
  document.getElementById('capscreen').style.display='flex';
  confetti({particleCount:120,spread:80,origin:{y:0.6},colors:['#ff1a1a','#ff6600','#ffd700','#fff']});
}

function closeCap(){
  document.getElementById('capscreen').style.display='none';
  setMsg('✅ 도감에 저장됨!','#00ff88');
  setTimeout(()=>{appeared=false;setMsg('📡 주변을 탐색하세요!','#fff');},2500);
}

function showBook(){document.getElementById('book').style.display='block';renderGrid();}
function closeBook(){document.getElementById('book').style.display='none';}
function switchTab(t){
  currentTab=t;
  document.getElementById('tg').className=t==='g'?'tab on':'tab';
  document.getElementById('ti').className=t==='i'?'tab on':'tab';
  renderGrid();
}
function renderGrid(){
  const data=currentTab==='g'?ghosts:items;
  const got=data.filter(d=>collected.includes(d.id)).length;
  document.getElementById('pf').style.width=(got/data.length*100)+'%';
  const grid=document.getElementById('grid');grid.innerHTML='';
  data.forEach(d=>{
    const has=collected.includes(d.id);
    const div=document.createElement('div');
    div.className='slot '+(has?'got':'nope');
    if(d.rarity)div.style.borderColor=has?(RC[d.rarity]||'#555')+'55':'rgba(255,255,255,0.07)';
    if(has){
      const frame=document.createElement('div');frame.className='pframe';
      const c=document.createElement('canvas');c.width=51;c.height=45;
      frame.appendChild(c);div.appendChild(frame);
      if(currentTab==='g')drawGhost(c,d,51);else drawItem(c,d);
      const nm=document.createElement('div');nm.className='sname';nm.textContent=d.name;div.appendChild(nm);
      if(d.rarity){const rl=document.createElement('div');rl.className='rlab';rl.style.color=RC[d.rarity]||'#aaa';rl.textContent='★ '+RL[d.rarity];div.appendChild(rl);}
    }else{
      const lk=document.createElement('div');lk.className='lock';lk.textContent='🔒';div.appendChild(lk);
      const nm=document.createElement('div');nm.className='sname';nm.textContent='???';div.appendChild(nm);
    }
    grid.appendChild(div);
  });
}

function updateCnt(){document.getElementById('cnt').textContent=`📖 ${collected.length} / 25`;}
function setMsg(t,c='#fff'){const el=document.getElementById('msgtxt');el.textContent=t;el.style.color=c;}
function manualScan(){if(appeared)return;radarV=96;setMsg('🔦 탐색 중...','#0f0');if(navigator.vibrate)navigator.vibrate(50);}

window.onload=start;
</script>
