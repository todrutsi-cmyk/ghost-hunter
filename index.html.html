<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>신비아파트 고스트헌터 AR</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
body{background:#000;font-family:'Segoe UI',sans-serif;overflow:hidden;touch-action:none;}
#video{position:fixed;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:0;}
#canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1;pointer-events:none;}
#touchLayer{position:fixed;top:0;left:0;width:100%;height:100%;z-index:3;}
#hud{position:fixed;top:0;left:0;right:0;padding:10px 14px;z-index:10;pointer-events:none;}
.hud-top{display:flex;justify-content:space-between;}
.hud-box{background:rgba(0,0,20,.8);border:1px solid rgba(100,180,255,.35);border-radius:12px;padding:7px 11px;backdrop-filter:blur(6px);}
.stat-row{display:flex;align-items:center;gap:5px;margin:2px 0;font-size:11px;color:#cde;}
.stat-val{font-weight:700;color:#fff;}
#timerWrap{position:fixed;top:0;left:0;right:0;height:4px;background:rgba(0,0,0,.5);z-index:11;pointer-events:none;}
#timerFill{height:100%;background:linear-gradient(90deg,#0af,#08f);transition:width .1s,background .3s;}
#weaponHUD{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:rgba(0,0,20,.85);border:1px solid rgba(100,180,255,.45);border-radius:14px;padding:7px 16px;z-index:10;pointer-events:none;display:flex;align-items:center;gap:10px;}
#weaponIcon{font-size:22px;}
#weaponName{color:#aef;font-size:12px;font-weight:700;}
#weaponDmg{color:#f8c;font-size:11px;}
#comboDisplay{position:fixed;top:42%;left:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:20;text-align:center;opacity:0;transition:opacity .3s;}
#comboText{font-size:38px;font-weight:900;color:#ff0;text-shadow:0 0 20px #fa0,0 0 40px #f80;}
#comboSub{font-size:13px;color:#fda;margin-top:2px;}
.screen{position:fixed;top:0;left:0;width:100%;height:100%;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;}
#startScreen{background:linear-gradient(160deg,#080014,#04001e,#000);}
#startScreen h1{font-size:30px;font-weight:900;color:#fff;text-align:center;text-shadow:0 0 30px #88f;letter-spacing:2px;line-height:1.3;}
#startGhost{font-size:78px;animation:sgF 2s ease-in-out infinite;margin-bottom:8px;}
@keyframes sgF{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.btn{background:linear-gradient(135deg,#1a0080,#0040ff);color:#fff;border:none;border-radius:14px;padding:13px 34px;font-size:15px;font-weight:700;cursor:pointer;letter-spacing:1px;box-shadow:0 4px 20px rgba(80,100,255,.5);margin:5px;}
.btn:active{transform:scale(.95);}
.btn.gold{background:linear-gradient(135deg,#664400,#ffaa00);}
.btn.green{background:linear-gradient(135deg,#004400,#00bb44);}
.btn.red{background:linear-gradient(135deg,#800,#f00);}
.btn.sm{padding:9px 18px;font-size:12px;}
.ghost-sprite{position:fixed;z-index:5;pointer-events:auto;cursor:pointer;}
.ghost-inner{display:flex;flex-direction:column;align-items:center;animation:gF 2.6s ease-in-out infinite;}
@keyframes gF{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-16px) rotate(2deg)}}
.ghost-emoji{font-size:60px;filter:drop-shadow(0 0 12px rgba(150,100,255,.9));}
.ghost-hp-bar{width:65px;height:7px;background:rgba(0,0,0,.5);border-radius:4px;margin-top:3px;overflow:hidden;}
.ghost-hp-fill{height:100%;background:linear-gradient(90deg,#f00,#f80);border-radius:4px;transition:width .12s;}
.ghost-name{color:#ddf;font-size:9px;font-weight:700;text-shadow:0 0 5px #88f;margin-top:2px;}
.ghost-hit{animation:hF .18s;}
@keyframes hF{0%,100%{filter:drop-shadow(0 0 12px rgba(150,100,255,.9))}50%{filter:brightness(3.5) drop-shadow(0 0 18px #fff)}}
.boss-sprite .ghost-emoji{font-size:90px;}
.boss-sprite .ghost-hp-bar{width:110px;height:10px;}
.dmg-text{position:fixed;z-index:30;font-size:22px;font-weight:900;color:#ff4;text-shadow:0 0 10px #f80;pointer-events:none;animation:dA .7s forwards;}
@keyframes dA{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-55px) scale(.6)}}
.item-sprite{position:fixed;z-index:4;pointer-events:auto;cursor:pointer;animation:iF 1.8s ease-in-out infinite;}
@keyframes iF{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.item-emoji{font-size:40px;filter:drop-shadow(0 0 8px gold);}
#polaroidOverlay{position:fixed;top:0;left:0;width:100%;height:100%;z-index:60;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;}
.polaroid{background:#f5f0e8;padding:15px 15px 46px;border-radius:3px;box-shadow:0 8px 40px rgba(0,0,0,.8);transform:rotate(-2deg);max-width:260px;text-align:center;animation:pI .38s ease;}
@keyframes pI{from{transform:scale(.4) rotate(-12deg);opacity:0}to{transform:scale(1) rotate(-2deg);opacity:1}}
.polaroid-ghost{font-size:76px;display:block;margin:8px 0;}
.polaroid-label{font-family:monospace;color:#333;font-size:12px;}
.polaroid-reward{color:#a80;font-weight:700;font-size:14px;margin-top:5px;}
#flashOverlay{position:fixed;top:0;left:0;width:100%;height:100%;background:#fff;z-index:55;opacity:0;pointer-events:none;transition:opacity .08s;}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;z-index:80;background:rgba(0,0,18,.94);display:none;flex-direction:column;align-items:center;overflow-y:auto;padding:16px 0 80px;}
.modal.active{display:flex;}
.modal-title{font-size:20px;font-weight:900;color:#aef;margin:16px 0 14px;text-align:center;}
.modal-close{position:fixed;top:12px;right:14px;font-size:28px;color:#88f;cursor:pointer;z-index:81;}
.shop-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;width:100%;max-width:420px;padding:0 14px;}
.shop-item{background:rgba(18,18,55,.92);border:1px solid rgba(100,120,255,.35);border-radius:11px;padding:11px;cursor:pointer;}
.shop-item:active{transform:scale(.96);}
.shop-item.owned{border-color:#0f8;}
.shop-item.equipped{border-color:#ff0;background:rgba(45,45,0,.55);}
.shop-emoji{font-size:28px;}
.shop-name{font-size:12px;font-weight:700;color:#cdf;margin:3px 0 2px;}
.shop-stat{font-size:10px;color:#89a;}
.shop-price{font-size:11px;color:#fda;font-weight:700;margin-top:3px;}
.upgrade-card{background:rgba(18,18,55,.92);border:1px solid rgba(100,120,255,.35);border-radius:11px;padding:13px;width:100%;max-width:420px;margin:6px 14px;}
.upgrade-card h3{color:#aef;font-size:14px;margin-bottom:7px;}
.mat-row{display:flex;justify-content:space-between;margin:3px 0;font-size:11px;color:#bcd;}
.mat-have{color:#0f0;font-weight:700;}
.mat-need{color:#f80;}
.inv-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;width:100%;max-width:420px;padding:0 14px;}
.inv-mat{background:rgba(18,18,55,.9);border:1px solid rgba(80,120,200,.35);border-radius:10px;padding:9px;text-align:center;}
.inv-mat .me{font-size:26px;}
.inv-mat .mn{font-size:9px;color:#9ab;margin-top:2px;}
.inv-mat .mc{font-size:15px;font-weight:700;color:#fff;}
.ach-item{background:rgba(18,18,55,.85);border:1px solid rgba(80,80,200,.35);border-radius:10px;padding:10px 13px;width:100%;max-width:420px;margin:3px 14px;display:flex;gap:11px;align-items:center;}
.ach-done{border-color:#f80;background:rgba(55,38,0,.5);}
.ach-icon{font-size:26px;}
.ach-info h4{color:#def;font-size:12px;}
.ach-info p{color:#89a;font-size:10px;}
.ach-reward{color:#fc0;font-size:10px;font-weight:700;}
#bottomBar{position:fixed;bottom:0;left:0;right:0;height:78px;background:rgba(0,0,18,.92);border-top:1px solid rgba(100,150,255,.28);display:flex;justify-content:space-around;align-items:center;z-index:10;backdrop-filter:blur(8px);}
.bar-btn{display:flex;flex-direction:column;align-items:center;gap:2px;color:#88c;font-size:10px;font-weight:600;cursor:pointer;padding:7px 11px;border-radius:10px;}
.bar-btn:active{background:rgba(100,150,255,.2);transform:scale(.92);}
.bar-btn .bbi{font-size:23px;}
#bossAlert{position:fixed;top:28%;left:50%;transform:translate(-50%,-50%);z-index:35;text-align:center;pointer-events:none;opacity:0;transition:opacity .5s;}
#bossAlert h2{font-size:40px;font-weight:900;color:#f00;text-shadow:0 0 20px #f00,0 0 60px #800;animation:bS .08s infinite;}
@keyframes bS{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(1deg)}}
#lvlBanner{position:fixed;top:20%;left:50%;transform:translateX(-50%);z-index:40;text-align:center;pointer-events:none;opacity:0;transition:opacity .4s;}
#lvlBanner h2{font-size:30px;font-weight:900;color:#ff0;text-shadow:0 0 20px #f80;}
#notif{position:fixed;top:76px;left:50%;transform:translateX(-50%);z-index:50;background:rgba(8,8,36,.96);border:1px solid rgba(100,150,255,.45);border-radius:10px;padding:9px 18px;color:#aef;font-size:12px;font-weight:700;text-align:center;opacity:0;transition:opacity .3s;pointer-events:none;max-width:310px;white-space:nowrap;}
#specialEvt{position:fixed;top:0;left:0;width:100%;height:100%;z-index:45;pointer-events:none;display:none;}
.se-bg{position:absolute;top:0;left:0;width:100%;height:100%;background:radial-gradient(ellipse at center,rgba(100,0,255,.28) 0%,transparent 70%);animation:seP .9s ease-in-out infinite;}
@keyframes seP{0%,100%{opacity:.4}50%{opacity:1}}
.particle{position:fixed;pointer-events:none;z-index:25;border-radius:50%;animation:pF .75s forwards;}
@keyframes pF{0%{opacity:1;transform:scale(1) translate(0,0)}100%{opacity:0;transform:scale(0) translate(var(--px),var(--py))}}
#gameOverScreen{background:rgba(0,0,0,.96);}
#gameOverScreen h2{font-size:34px;font-weight:900;color:#f44;text-shadow:0 0 28px #f00;margin-bottom:14px;}
.result-box{background:rgba(18,18,55,.92);border:1px solid rgba(100,120,255,.35);border-radius:14px;padding:18px 28px;text-align:center;margin-bottom:18px;min-width:250px;}
.r-row{display:flex;justify-content:space-between;gap:28px;margin:5px 0;font-size:13px;color:#bdf;}
.r-val{color:#fff;font-weight:700;}
</style>
</head>
<body>
<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>
<div id="touchLayer"></div>
<div id="flashOverlay"></div>
<div id="notif"></div>
<div id="timerWrap"><div id="timerFill" style="width:100%"></div></div>

<div id="hud">
  <div class="hud-top">
    <div class="hud-box">
      <div class="stat-row"><span>👻</span><span>처치</span><span class="stat-val" id="hKill">0</span></div>
      <div class="stat-row"><span>💀</span><span>실패</span><span class="stat-val" id="hFail">0</span><span style="color:#f88;font-size:10px">/3</span></div>
      <div class="stat-row"><span>🔥</span><span>콤보</span><span class="stat-val" id="hCombo">0</span></div>
    </div>
    <div class="hud-box">
      <div class="stat-row"><span>⭐</span><span>Lv.</span><span class="stat-val" id="hLv">1</span></div>
      <div class="stat-row" style="font-size:9px;color:#88f;" id="hTitle">신입 헌터</div>
      <div class="stat-row"><span>💰</span><span class="stat-val" id="hGold">0</span><span style="color:#fa0;font-size:10px">G</span></div>
      <div class="stat-row"><span>✨</span><span class="stat-val" id="hExp">0</span><span style="color:#8af;font-size:10px">XP</span></div>
    </div>
  </div>
</div>

<div id="weaponHUD">
  <span id="weaponIcon">🗡️</span>
  <div><div id="weaponName">기본 퇴마봉</div><div id="weaponDmg">공격력: 10 | 강화: +0</div></div>
</div>

<div id="comboDisplay">
  <div id="comboText">3 COMBO!</div>
  <div id="comboSub">공격력 +9%</div>
</div>

<div id="bossAlert"><h2>⚠️ 보스 출현! ⚠️</h2></div>
<div id="lvlBanner"><h2>🌟 레벨 업!</h2><div id="lvlTitle" style="color:#fda;font-size:15px;margin-top:3px;"></div></div>
<div id="specialEvt"><div class="se-bg"></div></div>

<div id="polaroidOverlay" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;z-index:60;background:rgba(0,0,0,.85);align-items:center;justify-content:center;">
  <div class="polaroid">
    <span class="polaroid-ghost" id="polEmoji">👻</span>
    <div class="polaroid-label" id="polName">귀신</div>
    <div class="polaroid-reward" id="polReward">+50G · +30XP</div>
    <div style="margin-top:8px;color:#666;font-size:10px;">📷 포획 완료</div>
  </div>
</div>

<div id="bottomBar">
  <div class="bar-btn" onclick="openShop()"><span class="bbi">🏪</span>상점</div>
  <div class="bar-btn" onclick="openUpgrade()"><span class="bbi">⚒️</span>강화</div>
  <div class="bar-btn" onclick="openInventory()"><span class="bbi">🎒</span>인벤</div>
  <div class="bar-btn" onclick="openAch()"><span class="bbi">🏆</span>업적</div>
</div>

<div class="screen" id="startScreen">
  <div id="startGhost">👻</div>
  <h1>신비아파트<br>고스트헌터 AR</h1>
  <p style="color:#88f;font-size:13px;margin:6px 0 28px;">카메라로 귀신을 잡아라!</p>
  <button class="btn" onclick="startGame()">🎮 게임 시작</button>
  <button class="btn gold" onclick="loadGame()">💾 이어하기</button>
  <div style="color:#334;font-size:10px;margin-top:10px;">카메라 권한이 필요합니다</div>
</div>

<div class="screen" id="gameOverScreen" style="display:none;">
  <h2>💀 게임 오버</h2>
  <div class="result-box">
    <div class="r-row"><span>이번 처치</span><span class="r-val" id="goKill">0</span></div>
    <div class="r-row"><span>획득 골드</span><span class="r-val" id="goGold">0G</span></div>
    <div class="r-row"><span>레벨</span><span class="r-val" id="goLv">1</span></div>
    <div class="r-row"><span>최고 콤보</span><span class="r-val" id="goCombo">0</span></div>
  </div>
  <button class="btn" onclick="restartGame()">🔄 다시 시작</button>
  <button class="btn gold" onclick="goHome()">🏠 메인으로</button>
</div>

<div class="modal" id="shopModal">
  <span class="modal-close" onclick="closeM('shopModal')">✕</span>
  <div class="modal-title">⚔️ 무기 상점</div>
  <div class="shop-grid" id="shopGrid"></div>
</div>

<div class="modal" id="upgradeModal">
  <span class="modal-close" onclick="closeM('upgradeModal')">✕</span>
  <div class="modal-title">⚒️ 무기 강화</div>
  <div id="upgradeContent" style="width:100%;"></div>
</div>

<div class="modal" id="invModal">
  <span class="modal-close" onclick="closeM('invModal')">✕</span>
  <div class="modal-title">🎒 강화 재료 인벤토리</div>
  <div class="inv-grid" id="invGrid"></div>
</div>

<div class="modal" id="achModal">
  <span class="modal-close" onclick="closeM('achModal')">✕</span>
  <div class="modal-title">🏆 업적</div>
  <div id="achList" style="width:100%;"></div>
</div>

<script>
const GHOSTS=[
  {id:0,name:'흰 귀신',emoji:'👻',hp:30,gold:15,exp:10},{id:1,name:'해골 귀신',emoji:'💀',hp:50,gold:25,exp:18},
  {id:2,name:'악마 귀신',emoji:'😈',hp:70,gold:35,exp:25},{id:3,name:'거미 귀신',emoji:'🕷️',hp:45,gold:20,exp:15},
  {id:4,name:'박쥐 귀신',emoji:'🦇',hp:40,gold:18,exp:13},{id:5,name:'뱀 귀신',emoji:'🐍',hp:60,gold:30,exp:22},
  {id:6,name:'호박 귀신',emoji:'🎃',hp:55,gold:28,exp:20},{id:7,name:'외계 귀신',emoji:'👽',hp:80,gold:40,exp:30},
  {id:8,name:'로봇 귀신',emoji:'🤖',hp:90,gold:45,exp:35},{id:9,name:'좀비 귀신',emoji:'🧟',hp:100,gold:50,exp:40},
  {id:10,name:'뱀파이어',emoji:'🧛',hp:120,gold:60,exp:50},{id:11,name:'늑대인간',emoji:'🐺',hp:110,gold:55,exp:45},
  {id:12,name:'마녀',emoji:'🧙',hp:85,gold:42,exp:32},{id:13,name:'해파리 귀신',emoji:'🪼',hp:35,gold:16,exp:11},
  {id:14,name:'용 귀신',emoji:'🐉',hp:150,gold:75,exp:60},{id:15,name:'악령',emoji:'😱',hp:65,gold:32,exp:24},
  {id:16,name:'도깨비',emoji:'👹',hp:130,gold:65,exp:52},{id:17,name:'두 얼굴',emoji:'🃏',hp:75,gold:38,exp:28},
  {id:18,name:'유령 손',emoji:'🤚',hp:25,gold:12,exp:8},{id:19,name:'눈알 귀신',emoji:'👁️',hp:55,gold:27,exp:20},
  {id:20,name:'얼음 귀신',emoji:'❄️',hp:95,gold:47,exp:38},{id:21,name:'불꽃 귀신',emoji:'🔥',hp:105,gold:52,exp:42},
  {id:22,name:'번개 귀신',emoji:'⚡',hp:70,gold:35,exp:26},{id:23,name:'독 귀신',emoji:'☠️',hp:85,gold:42,exp:33},
  {id:24,name:'문어 귀신',emoji:'🐙',hp:115,gold:57,exp:46},{id:25,name:'구미호',emoji:'🦊',hp:140,gold:70,exp:56},
  {id:26,name:'거북 귀신',emoji:'🐢',hp:200,gold:100,exp:80},{id:27,name:'고래 귀신',emoji:'🐋',hp:180,gold:90,exp:72},
  {id:28,name:'사신',emoji:'💫',hp:160,gold:80,exp:64},{id:29,name:'궁극 악마',emoji:'🔱',hp:250,gold:125,exp:100},
];
const BOSS={id:99,name:'👑 귀신왕',emoji:'🫠',hp:1500,gold:500,exp:400,isBoss:true};
const SPECIAL={id:98,name:'✨ 황금 귀신',emoji:'🌟',hp:200,gold:300,exp:250,isSpecial:true};
const ITEMS=[
  {id:0,name:'골드 주머니',emoji:'💰',effect:'gold',value:50},{id:1,name:'경험치 구슬',emoji:'🔮',effect:'exp',value:40},
  {id:2,name:'퇴마 물약',emoji:'🧪',effect:'damage',value:2,dur:8},{id:3,name:'방패 부적',emoji:'🛡️',effect:'shield',dur:10},
  {id:4,name:'시간 연장',emoji:'⏰',effect:'time',value:20},{id:5,name:'폭탄 부적',emoji:'💣',effect:'bomb',value:80},
  {id:6,name:'골드 두 배',emoji:'🎰',effect:'goldx2',dur:15},{id:7,name:'강화 재료A',emoji:'💎',effect:'mat',value:'matA'},
  {id:8,name:'강화 재료B',emoji:'🪨',effect:'mat',value:'matB'},{id:9,name:'강화 재료C',emoji:'🌙',effect:'mat',value:'matC'},
  {id:10,name:'강화 재료D',emoji:'⚗️',effect:'mat',value:'matD'},{id:11,name:'콤보 부스터',emoji:'🌀',effect:'combo',value:5},
  {id:12,name:'전체 공격',emoji:'💥',effect:'aoe',value:50},{id:13,name:'부활 부적',emoji:'🌸',effect:'revive'},
  {id:14,name:'황금 부적',emoji:'🏅',effect:'gold',value:150},{id:15,name:'레어 재료',emoji:'🌈',effect:'mat',value:'matRare'},
  {id:16,name:'HP 회복',emoji:'💊',effect:'revive'},{id:17,name:'귀신 소환',emoji:'📣',effect:'summon'},
  {id:18,name:'무기강화석',emoji:'🔷',effect:'mat',value:'matWeapon'},{id:19,name:'경험치 폭탄',emoji:'💠',effect:'exp',value:100},
];
const WEAPONS=[

const dS=()=>({gold:0,exp:0,level:1,title:'신입 헌터',totalKills:0,bossKills:0,specialKills:0,totalItems:0,maxCombo:0,ownedWeapons:1,maxWLv:0,achDone:0,weapons:[0],equippedWeapon:0,weaponLevels:{0:0},materials:{matA:0,matB:0,matC:0,matD:0,matRare:0,matWeapon:0},achievements:{}});
let S=dS(),activeG=[],activeI=[],gid=0;
let timerIv,spawnIv,itemIv,comboTimer,notifTimer;
let bossSpawned=false,gameRunning=false,timeLeft=90,maxTime=90;
let buffs={damage:1,goldx2:false,shield:false};
let sKills=0,sGold=0,sCombo=0;

function save(){const d=Object.assign({},S);localStorage.setItem('sngh2',JSON.stringify(d));}
function loadGame(){
  const r=localStorage.getItem('sngh2');
  if(!r){notify('저장 데이터가 없습니다.');return;}
  Object.assign(S,JSON.parse(r));notify('💾 이어하기 완료!');startGame();
}

async function initCam(){
  try{
    const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280},height:{ideal:720}}});
    document.getElementById('video').srcObject=s;return true;
  }catch(e){notify('카메라 오류: '+e.message);return false;}
}

async function startGame(){
  document.getElementById('startScreen').style.display='none';
  document.getElementById('gameOverScreen').style.display='none';
  if(!await initCam())return;
  sKills=0;sGold=0;sCombo=0;S.combo=0;S.fails=0||0;
  timeLeft=maxTime;bossSpawned=false;gameRunning=true;
  buffs={damage:1,goldx2:false,shield:false};
  activeG=[];activeI=[];clearLayer();
  updateHUD();updateWHUD();startTimers();
}

function startTimers(){
  clearInterval(timerIv);clearInterval(spawnIv);clearInterval(itemIv);
  timerIv=setInterval(()=>{
    if(!gameRunning)return;
    timeLeft=Math.max(0,timeLeft-.1);
    const p=timeLeft/maxTime*100,tf=$('timerFill');
    tf.style.width=p+'%';tf.style.background=timeLeft<20?'linear-gradient(90deg,#f00,#f80)':'linear-gradient(90deg,#0af,#08f)';
    if(timeLeft<=0)endGame();
    if(S.totalKills>=50&&!bossSpawned)spawnBoss();
  },100);
  spawnIv=setInterval(()=>{
    if(!gameRunning||activeG.length>=6)return;
    Math.random()<.03?spawnSpecial():mkGhost(GHOSTS[Math.floor(Math.random()*GHOSTS.length)]);
  },2500);
  itemIv=setInterval(()=>{if(gameRunning&&activeI.length<5)mkItem();},4500);
}

function endGame(){
  gameRunning=false;clearInterval(timerIv);clearInterval(spawnIv);clearInterval(itemIv);
  clearLayer();save();
  $('goKill').textContent=sKills;$('goGold').textContent=sGold+'G';
  $('goLv').textContent=S.level;$('goCombo').textContent=S.maxCombo;
  $('gameOverScreen').style.display='flex';
}

function restartGame(){
  $('gameOverScreen').style.display='none';
  sKills=0;sGold=0;sCombo=0;S.combo=0;S.fails=0;
  timeLeft=maxTime;bossSpawned=false;gameRunning=true;
  buffs={damage:1,goldx2:false,shield:false};
  activeG=[];activeI=[];clearLayer();updateHUD();updateWHUD();startTimers();
}

function goHome(){$('gameOverScreen').style.display='none';$('startScreen').style.display='flex';}

function spawnBoss(){bossSpawned=true;showBossAlert();mkGhost(BOSS);}
function spawnSpecial(){showSpecialEvt();mkGhost(SPECIAL);}

function mkGhost(gd){
  const uid='g'+(gid++),hp=gd.hp+S.level*4;
  const obj={uid,data:gd,hp,maxHp:hp,x:5+Math.random()*76,y:8+Math.random()*62,el:null,hpF:null,emEl:null,timer:null};
  const el=document.createElement('div');
  el.className='ghost-sprite'+(gd.isBoss?' boss-sprite':'');
  el.id=uid;el.style.left=obj.x+'%';el.style.top=obj.y+'%';
  const inn=document.createElement('div');inn.className='ghost-inner';
  const em=document.createElement('div');em.className='ghost-emoji';em.textContent=gd.emoji;
  const nm=document.createElement('div');nm.className='ghost-name';nm.textContent=gd.name;
  const bar=document.createElement('div');bar.className='ghost-hp-bar';
  const fill=document.createElement('div');fill.className='ghost-hp-fill';
  bar.appendChild(fill);inn.append(em,nm,bar);el.appendChild(inn);
  $('touchLayer').appendChild(el);
  obj.el=el;obj.hpF=fill;obj.emEl=em;
  obj.timer=setTimeout(()=>ghostEsc(obj),gd.isBoss?60000:7000+Math.random()*6000);
  activeG.push(obj);
  el.addEventListener('touchstart',e=>{e.preventDefault();e.stopPropagation();atk(obj,e.touches[0]);},{passive:false});
  el.addEventListener('mousedown',e=>{e.preventDefault();atk(obj,e);});
}

function mkItem(){
  const d=ITEMS[Math.floor(Math.random()*ITEMS.length)],uid='i'+(gid++);
  const obj={uid,data:d,x:5+Math.random()*82,y:18+Math.random()*62,el:null,timer:null};
  const el=document.createElement('div');el.className='item-sprite';el.id=uid;
  el.style.left=obj.x+'%';el.style.top=obj.y+'%';
  const em=document.createElement('div');em.className='item-emoji';em.textContent=d.emoji;
  el.appendChild(em);$('touchLayer').appendChild(el);obj.el=el;
  obj.timer=setTimeout(()=>rmI(obj),7000);activeI.push(obj);
  el.addEventListener('touchstart',e=>{e.preventDefault();e.stopPropagation();collectItem(obj);},{passive:false});
  el.addEventListener('mousedown',e=>{e.preventDefault();collectItem(obj);});
}

function atk(ghost,ev){
  if(!gameRunning)return;
  const w=WEAPONS[S.equippedWeapon],lv=S.weaponLevels[S.equippedWeapon]||0;
  const bonus=RECIPES.slice(0,lv).reduce((a,r)=>a+r.bonus,0);
  const cmult=1+Math.min((S.combo||0)*.03,1.0);
  const dmg=Math.floor((w.dmg+bonus)*buffs.damage*cmult);
  ghost.hp-=dmg;
  ghost.emEl.classList.remove('ghost-hit');void ghost.emEl.offsetWidth;ghost.emEl.classList.add('ghost-hit');
  const cx=ev.clientX||ev.pageX,cy=ev.clientY||ev.pageY;
  showDmg(cx,cy,dmg);particles(cx,cy);doCombo();
  const p=Math.max(0,ghost.hp/ghost.maxHp*100);
  ghost.hpF.style.width=p+'%';
  if(p<30)ghost.hpF.style.background='linear-gradient(90deg,#f00,#f44)';
  else if(p<60)ghost.hpF.style.background='linear-gradient(90deg,#f80,#ff0)';
  if(ghost.hp<=0)killGhost(ghost);
}

function killGhost(ghost){
  clearTimeout(ghost.timer);
  const g=ghost.data,gamt=Math.floor(g.gold*(buffs.goldx2?2:1)*(1+Math.floor(S.level/5)*.1));
  S.gold+=gamt;sGold+=gamt;S.exp+=g.exp;S.totalKills++;sKills++;
  if(g.isBoss){S.bossKills++;timeLeft=Math.min(timeLeft+30,maxTime);notify('⏰ 보스 처치! +30초!');}
  if(g.isSpecial)S.specialKills++;
  if(Math.random()<.3){
    const mk=Object.keys(S.materials)[Math.floor(Math.random()*6)];
    S.materials[mk]++;notify('📦 '+MATS.find(m=>m.id===mk).name+' 획득!');
  }
  rmG(ghost);polaroid(g,gamt,g.exp);checkLvl();checkAch();updateHUD();save();
}

function ghostEsc(ghost){
  if(!gameRunning||ghost.hp<=0)return;
  if(buffs.shield){notify('🛡️ 방패 부적이 막았다!');rmG(ghost);return;}
  if(!S.fails)S.fails=0;S.fails++;
  notify('💨 '+ghost.data.name+' 도망! 실패 '+S.fails+'/3');
  if(S.fails>=3){endGame();return;}
  rmG(ghost);updateHUD();
}

function rmG(g){if(g.el&&g.el.parentNode)g.el.parentNode.removeChild(g.el);activeG=activeG.filter(x=>x.uid!==g.uid);}
function rmI(i){if(i.el&&i.el.parentNode)i.el.parentNode.removeChild(i.el);activeI=activeI.filter(x=>x.uid!==i.uid);}
function clearLayer(){$('touchLayer').innerHTML='';activeG=[];activeI=[];}

function collectItem(item){
  if(!gameRunning)return;
  clearTimeout(item.timer);const d=item.data;S.totalItems++;
  switch(d.effect){
    case 'gold':S.gold+=d.value;sGold+=d.value;notify('💰 골드 +'+d.value+'!');break;
    case 'exp':S.exp+=d.value;notify('✨ 경험치 +'+d.value+'!');checkLvl();break;
    case 'damage':buffs.damage=d.value;setTimeout(()=>buffs.damage=1,(d.dur||8)*1000);notify('⚔️ 공격력 '+d.value+'배 '+d.dur+'초!');break;
    case 'shield':buffs.shield=true;setTimeout(()=>buffs.shield=false,(d.dur||10)*1000);notify('🛡️ 방패 '+d.dur+'초!');break;
    case 'time':timeLeft=Math.min(timeLeft+d.value,maxTime);notify('⏰ 시간 +'+d.value+'초!');break;
    case 'bomb':activeG.forEach(g=>{g.hp-=d.value;if(g.hpF)g.hpF.style.width=Math.max(0,g.hp/g.maxHp*100)+'%';if(g.hp<=0)setTimeout(()=>killGhost(g),50);});notify('💣 전체 공격!');break;
    case 'goldx2':buffs.goldx2=true;setTimeout(()=>buffs.goldx2=false,(d.dur||15)*1000);notify('🎰 골드 2배 '+d.dur+'초!');break;
    case 'mat':S.materials[d.value]++;notify('📦 '+MATS.find(m=>m.id===d.value).name+' 획득!');break;
    case 'combo':S.combo=(S.combo||0)+d.value;notify('🌀 콤보 +'+d.value+'!');break;
    case 'aoe':activeG.forEach(g=>{g.hp-=d.value;if(g.hp<=0)setTimeout(()=>killGhost(g),50);});notify('💥 전체 공격!');break;
    case 'revive':S.fails=Math.max(0,(S.fails||0)-1);notify('🌸 실패 1회 회복!');break;
    case 'summon':if(activeG.length<6)mkGhost(GHOSTS[Math.floor(Math.random()*GHOSTS.length)]);notify('📣 귀신 소환!');break;
  }
  rmI(item);updateHUD();checkAch();save();
}

function doCombo(){
  S.combo=(S.combo||0)+1;if(S.combo>S.maxCombo)S.maxCombo=S.combo;
  if(comboTimer)clearTimeout(comboTimer);
  comboTimer=setTimeout(()=>{S.combo=0;updateHUD();},4000);
  if(S.combo>=3){
    const cd=$('comboDisplay');
    $('comboText').textContent=S.combo+' COMBO!';
    $('comboSub').textContent='공격력 +'+Math.min(Math.floor(S.combo*3),90)+'%';
    cd.style.opacity='1';setTimeout(()=>cd.style.opacity='0',1500);
  }
  updateHUD();
}

function expNeeded(lv){return lv*80+lv*lv*10;}
function checkLvl(){
  while(S.exp>=expNeeded(S.level)){
    S.exp-=expNeeded(S.level);S.level++;
    const t=TITLES.filter(x=>S.level>=x.lv).pop();if(t)S.title=t.t;
    $('lvlTitle').textContent=S.title;
    const el=$('lvlBanner');el.style.opacity='1';setTimeout(()=>el.style.opacity='0',2500);
  }
  updateHUD();
}

function checkAch(){
  ACHS.forEach(a=>{
    if(!S.achievements[a.id]&&a.cond(S)){
      S.achievements[a.id]=true;S.achDone=Object.keys(S.achievements).length;
      S.gold+=a.rg;S.exp+=a.re;
      notify('🏆 업적: '+a.name+'! +'+a.rg+'G');checkLvl();
    }
  });
}

function updateHUD(){
  $('hKill').textContent=sKills;$('hFail').textContent=S.fails||0;$('hCombo').textContent=S.combo||0;
  $('hLv').textContent=S.level;$('hTitle').textContent=S.title;$('hGold').textContent=S.gold;$('hExp').textContent=S.exp;
}

function updateWHUD(){
  const w=WEAPONS[S.equippedWeapon],lv=S.weaponLevels[S.equippedWeapon]||0;
  const bonus=RECIPES.slice(0,lv).reduce((a,r)=>a+r.bonus,0);
  $('weaponIcon').textContent=w.emoji;$('weaponName').textContent=w.name;
  $('weaponDmg').textContent='공격력: '+(w.dmg+bonus)+' | 강화: +'+lv;
}

function showDmg(x,y,d){
  const el=document.createElement('div');el.className='dmg-text';el.textContent='-'+d;
  el.style.left=(x-18)+'px';el.style.top=(y-18)+'px';document.body.appendChild(el);
  setTimeout(()=>el.remove(),700);
}

function particles(x,y){
  const cols=['#ff0','#f80','#f0f','#0ff','#fff','#0f8'];
  for(let i=0;i<7;i++){
    const p=document.createElement('div');p.className='particle';
    const a=Math.random()*Math.PI*2,d=20+Math.random()*50;
    p.style.setProperty('--px',Math.cos(a)*d+'px');p.style.setProperty('--py',Math.sin(a)*d+'px');
    p.style.background=cols[Math.floor(Math.random()*6)];
    const sz=4+Math.random()*8;p.style.width=sz+'px';p.style.height=sz+'px';
    p.style.left=(x+(Math.random()-.5)*20)+'px';p.style.top=(y+(Math.random()-.5)*20)+'px';
    document.body.appendChild(p);setTimeout(()=>p.remove(),800);
  }
}

function polaroid(g,gold,exp){
  const fl=$('flashOverlay');fl.style.opacity='1';setTimeout(()=>fl.style.opacity='0',130);
  $('polEmoji').textContent=g.emoji;$('polName').textContent=g.name;$('polReward').textContent='+'+gold+'G · +'+exp+'XP';
  const po=$('polaroidOverlay');po.style.display='flex';setTimeout(()=>po.style.display='none',1900);
}

function showBossAlert(){const e=$('bossAlert');e.style.opacity='1';setTimeout(()=>e.style.opacity='0',3000);}
function showSpecialEvt(){const e=$('specialEvt');e.style.display='block';setTimeout(()=>e.style.display='none',5000);}

function openShop(){
  const g=$('shopGrid');g.innerHTML='';
  WEAPONS.forEach(w=>{
    const owned=S.weapons.includes(w.id),eq=S.equippedWeapon===w.id;
    const d=document.createElement('div');
    d.className='shop-item'+(eq?' equipped':owned?' owned':'');
    d.innerHTML=`<div class="shop-emoji">${w.emoji}</div><div class="shop-name">${w.name}</div><div class="shop-stat">공격력: ${w.dmg}</div><div class="shop-stat">${w.desc}</div><div class="shop-price">${owned?(eq?'✅ 장착됨':'🎒 장착'):'💰 '+w.price+'G'}</div>`;
    d.onclick=()=>{
      if(S.weapons.includes(w.id)){S.equippedWeapon=w.id;if(S.weaponLevels[w.id]==null)S.weaponLevels[w.id]=0;notify('⚔️ '+w.name+' 장착!');updateWHUD();openShop();}
      else{if(S.gold<w.price){notify('💰 골드 부족!');return;}S.gold-=w.price;S.weapons.push(w.id);S.weaponLevels[w.id]=0;S.ownedWeapons=S.weapons.length;S.equippedWeapon=w.id;notify('🎉 '+w.name+' 구매!');updateHUD();updateWHUD();checkAch();save();openShop();}
    };
    g.appendChild(d);
  });
  $('shopModal').classList.add('active');
}

function openUpgrade(){
  const c=$('upgradeContent');c.innerHTML='';
  S.weapons.forEach(wid=>{
    const w=WEAPONS[wid],lv=S.weaponLevels[wid]||0,maxLv=RECIPES.length;
    const card=document.createElement('div');card.className='upgrade-card';card.style.margin='6px 14px';
    if(lv>=maxLv){card.innerHTML=`<h3>${w.emoji} ${w.name} <span style="color:#ff0">MAX ✨</span></h3><div style="color:#0f0;font-size:11px">최고 강화 달성!</div>`;
    }else{
      const rec=RECIPES[lv];let mh='',canUp=true;
      Object.entries(rec.mats).forEach(([mid,need])=>{
        const have=S.materials[mid]||0,mat=MATS.find(m=>m.id===mid),ok=have>=need;if(!ok)canUp=false;
        mh+=`<div class="mat-row"><span>${mat.emoji} ${mat.name}</span><span class="${ok?'mat-have':'mat-need'}">${have}/${need}</span></div>`;
      });
      card.innerHTML=`<h3>${w.emoji} ${w.name} <span style="color:#8af">Lv.${lv}→${lv+1}</span></h3><div style="color:#fa0;font-size:11px;margin-bottom:6px">공격력 +${rec.bonus}</div>${mh}<button class="btn sm ${canUp?'green':'red'}" style="margin-top:9px;width:100%" onclick="doUp(${wid})">⚒️ ${canUp?'강화하기':'재료 부족'}</button>`;
    }
    c.appendChild(card);
  });
  $('upgradeModal').classList.add('active');
}

function doUp(wid){
  const lv=S.weaponLevels[wid]||0;if(lv>=RECIPES.length){notify('이미 최고 레벨!');return;}
  const rec=RECIPES[lv];
  for(const[mid,need]of Object.entries(rec.mats)){if((S.materials[mid]||0)<need){notify('재료 부족!');return;}}
  for(const[mid,need]of Object.entries(rec.mats))S.materials[mid]-=need;
  S.weaponLevels[wid]=lv+1;if(S.weaponLevels[wid]>S.maxWLv)S.maxWLv=S.weaponLevels[wid];
  notify('⚒️ '+WEAPONS[wid].name+' 강화! Lv.'+(lv+1));updateWHUD();checkAch();save();openUpgrade();
}

function openInventory(){
  const g=$('invGrid');g.innerHTML='';
  MATS.forEach(m=>{
    const d=document.createElement('div');d.className='inv-mat';
    d.innerHTML=`<div class="me">${m.emoji}</div><div class="mn">${m.name}</div><div class="mc">${S.materials[m.id]||0}</div>`;
    g.appendChild(d);
  });
  $('invModal').classList.add('active');
}

function openAch(){
  const l=$('achList');l.innerHTML='';
  ACHS.forEach(a=>{
    const done=!!S.achievements[a.id];
    const d=document.createElement('div');d.className='ach-item'+(done?' ach-done':'');
    d.innerHTML=`<div class="ach-icon">${done?'✅':a.icon}</div><div class="ach-info"><h4>${a.name}</h4><p>${a.desc}</p><div class="ach-reward">보상: +${a.rg}G · +${a.re}XP${done?' ✓':''}</div></div>`;
    l.appendChild(d);
  });
  $('achModal').classList.add('active');
}

function closeM(id){$(id).classList.remove('active');}

function notify(msg){
  const el=$('notif');el.textContent=msg;el.style.opacity='1';
  clearTimeout(notifTimer);notifTimer=setTimeout(()=>el.style.opacity='0',2600);
}

function $(id){return document.getElementById(id);}

const cv=$('canvas'),cx2=cv.getContext('2d');
function resizeCv(){cv.width=innerWidth;cv.height=innerHeight;}
resizeCv();addEventListener('resize',resizeCv);
(function vig(){
  cx2.clearRect(0,0,cv.width,cv.height);
  const g=cx2.createRadialGradient(cv.width/2,cv.height/2,cv.height*.2,cv.width/2,cv.height/2,cv.height*.85);
  g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,40,.3)');
  cx2.fillStyle=g;cx2.fillRect(0,0,cv.width,cv.height);
  requestAnimationFrame(vig);
})();

document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('contextmenu',e=>e.preventDefault());
</script>
</body>
